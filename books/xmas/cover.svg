<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Shelf-card cover for the xmas book. Original vector, 4:3 to match the
       card aspect. Winter-night scene with a decorated tree + a reindeer head,
       echoing the book's palette. Not traced from any reference. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0a1b3a"/>
      <stop offset="55%" stop-color="#122a52"/>
      <stop offset="100%" stop-color="#1c3a66"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#eef5ff"/>
      <stop offset="70%" stop-color="#d7e6ff"/>
      <stop offset="100%" stop-color="rgba(215,230,255,0)"/>
    </radialGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#dfecff"/>
      <stop offset="100%" stop-color="#b9cdeb"/>
    </linearGradient>
    <radialGradient id="rnose" cx="40%" cy="35%" r="70%">
      <stop offset="0%"  stop-color="#ff7b6b"/>
      <stop offset="55%" stop-color="#e23b2e"/>
      <stop offset="100%" stop-color="#b2271c"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect width="400" height="300" fill="url(#sky)"/>

  <!-- moon + glow -->
  <circle cx="320" cy="70" r="60" fill="url(#moon)"/>
  <circle cx="320" cy="70" r="26" fill="#f2f7ff"/>

  <!-- faint stars -->
  <g fill="#dce9ff">
    <circle cx="60" cy="40" r="1.6"/><circle cx="110" cy="70" r="1.1"/>
    <circle cx="250" cy="36" r="1.3"/><circle cx="180" cy="54" r="1"/>
    <circle cx="350" cy="140" r="1.2"/>
  </g>

  <!-- snow field -->
  <path d="M0 230 Q 120 205 220 228 T 400 222 L400 300 L0 300 Z" fill="url(#snow)"/>

  <!-- a decorated pine on the left -->
  <g transform="translate(96 232)">
    <rect x="-9" y="-6" width="18" height="24" rx="3" fill="#4a3520"/>
    <path d="M0 -118 L34 -66 L-34 -66 Z" fill="#2b6a4a"/>
    <path d="M0 -92 L44 -30 L-44 -30 Z" fill="#2b6a4a"/>
    <path d="M0 -62 L54 0 L-54 0 Z" fill="#327a55"/>
    <!-- baubles -->
    <circle cx="-14" cy="-40" r="4.5" fill="#e2574e"/>
    <circle cx="16" cy="-22" r="4.5" fill="#f2c94c"/>
    <circle cx="-4" cy="-10" r="4.5" fill="#6fb7d6"/>
    <circle cx="24" cy="-52" r="4.5" fill="#d98cc4"/>
    <!-- gold star topper -->
    <path d="M0 -130 l5 11 12 1 -9 8 3 12 -11 -7 -11 7 3 -12 -9 -8 12 -1 z"
          fill="#f3c64b"/>
  </g>

  <!-- a friendly reindeer head on the right foreground -->
  <g transform="translate(248 196)">
    <!-- antlers -->
    <g fill="none" stroke="#8a5a33" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-26 -34 C-34 -54 -40 -62 -52 -66 M-34 -46 C-46 -46 -54 -42 -62 -46 M-34 -46 C-30 -58 -26 -66 -30 -78"/>
      <path d="M26 -34 C34 -54 40 -62 52 -66 M34 -46 C46 -46 54 -42 62 -46 M34 -46 C30 -58 26 -66 30 -78"/>
    </g>
    <!-- ears -->
    <ellipse cx="-34" cy="-6" rx="12" ry="17" fill="#8a5a28" transform="rotate(-24 -34 -6)"/>
    <ellipse cx="34" cy="-6" rx="12" ry="17" fill="#8a5a28" transform="rotate(24 34 -6)"/>
    <!-- head -->
    <ellipse cx="0" cy="8" rx="34" ry="37" fill="#a9743b"/>
    <!-- muzzle -->
    <ellipse cx="0" cy="30" rx="22" ry="19" fill="#e9cba0"/>
    <!-- eyes -->
    <circle cx="-13" cy="2" r="5" fill="#2b1d0e"/>
    <circle cx="13" cy="2" r="5" fill="#2b1d0e"/>
    <circle cx="-11" cy="0" r="1.6" fill="#fff"/>
    <circle cx="15" cy="0" r="1.6" fill="#fff"/>
    <!-- shiny red nose -->
    <circle cx="0" cy="33" r="11" fill="url(#rnose)"/>
    <circle cx="-3.5" cy="29.5" r="3" fill="#fff" opacity="0.8"/>
  </g>
</svg>
