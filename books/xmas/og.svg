<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Social / Open Graph preview for the XMAS book (1200x630). Original
       vector winter-night scene: moon, decorated pine, reindeer head, title. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0a1b3a"/>
      <stop offset="55%" stop-color="#122a52"/>
      <stop offset="100%" stop-color="#1c3a66"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#eef5ff"/>
      <stop offset="70%" stop-color="#d7e6ff"/>
      <stop offset="100%" stop-color="rgba(215,230,255,0)"/>
    </radialGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#dfecff"/>
      <stop offset="100%" stop-color="#b9cdeb"/>
    </linearGradient>
    <radialGradient id="rnose" cx="40%" cy="35%" r="70%">
      <stop offset="0%"  stop-color="#ff7b6b"/>
      <stop offset="55%" stop-color="#e23b2e"/>
      <stop offset="100%" stop-color="#b2271c"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- moon + glow -->
  <circle cx="1000" cy="130" r="130" fill="url(#moon)"/>
  <circle cx="1000" cy="130" r="56" fill="#f2f7ff"/>

  <!-- stars -->
  <g fill="#dce9ff">
    <circle cx="140" cy="80" r="3"/><circle cx="300" cy="130" r="2.2"/>
    <circle cx="560" cy="70" r="2.6"/><circle cx="760" cy="110" r="2"/>
    <circle cx="860" cy="300" r="2.4"/>
  </g>

  <!-- snow field -->
  <path d="M0 500 Q 360 455 660 498 T 1200 486 L1200 630 L0 630 Z" fill="url(#snow)"/>

  <!-- decorated pine, left -->
  <g transform="translate(270 500) scale(2.1)">
    <rect x="-9" y="-6" width="18" height="24" rx="3" fill="#4a3520"/>
    <path d="M0 -118 L34 -66 L-34 -66 Z" fill="#2b6a4a"/>
    <path d="M0 -92 L44 -30 L-44 -30 Z" fill="#2b6a4a"/>
    <path d="M0 -62 L54 0 L-54 0 Z" fill="#327a55"/>
    <circle cx="-14" cy="-40" r="4.5" fill="#e2574e"/>
    <circle cx="16" cy="-22" r="4.5" fill="#f2c94c"/>
    <circle cx="-4" cy="-10" r="4.5" fill="#6fb7d6"/>
    <circle cx="24" cy="-52" r="4.5" fill="#d98cc4"/>
    <path d="M0 -130 l5 11 12 1 -9 8 3 12 -11 -7 -11 7 3 -12 -9 -8 12 -1 z" fill="#f3c64b"/>
  </g>

  <!-- reindeer head, right foreground -->
  <g transform="translate(720 360) scale(2.0)">
    <g fill="none" stroke="#8a5a33" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-26 -34 C-34 -54 -40 -62 -52 -66 M-34 -46 C-46 -46 -54 -42 -62 -46 M-34 -46 C-30 -58 -26 -66 -30 -78"/>
      <path d="M26 -34 C34 -54 40 -62 52 -66 M34 -46 C46 -46 54 -42 62 -46 M34 -46 C30 -58 26 -66 30 -78"/>
    </g>
    <ellipse cx="-34" cy="-6" rx="12" ry="17" fill="#8a5a28" transform="rotate(-24 -34 -6)"/>
    <ellipse cx="34" cy="-6" rx="12" ry="17" fill="#8a5a28" transform="rotate(24 34 -6)"/>
    <ellipse cx="0" cy="8" rx="34" ry="37" fill="#a9743b"/>
    <ellipse cx="0" cy="30" rx="22" ry="19" fill="#e9cba0"/>
    <circle cx="-13" cy="2" r="5" fill="#2b1d0e"/>
    <circle cx="13" cy="2" r="5" fill="#2b1d0e"/>
    <circle cx="-11" cy="0" r="1.6" fill="#fff"/>
    <circle cx="15" cy="0" r="1.6" fill="#fff"/>
    <circle cx="0" cy="33" r="11" fill="url(#rnose)"/>
    <circle cx="-3.5" cy="29.5" r="3" fill="#fff" opacity="0.8"/>
  </g>

  <!-- title: bouncy comic lettering with a thick dark outline, to match the
       library wordmark. Playful font stack + paint-order stroke-behind-fill. -->
  <g font-family="'Comic Sans MS','Chalkboard SE','Baloo 2','Fredoka',
                  'Trebuchet MS',system-ui,sans-serif"
     font-weight="800" font-size="96"
     style="paint-order:stroke fill" stroke="#0a1b3a"
     stroke-width="9" stroke-linejoin="round">
    <text x="78" y="150" fill="#ffd54a" transform="rotate(-3 78 150)">Christmas</text>
    <text x="78" y="250" fill="#ff8f6b" transform="rotate(2 78 250)">Storybook!</text>
  </g>
</svg>
