    <g transform="rotate(-28 78 182)">
      <path d="M76 181L89 174L91.5 178L78.5 187Z" fill="#3c5cc6"/><rect x="89" y="173" width="4" height="5" rx="1.5" fill="#f3c8a2"/>
      <path d="M91 176L101 161" stroke="#24163f" stroke-width="2" stroke-linecap="round"/>
      <use href="#sbStar" transform="translate(101.5 160) scale(4)" fill="url(#sbGold)"/>
    </g>
    <path d="M64.5 168L66 160L72 158L78 160L79.5 168L72 172.5Z" fill="#7a4422"/>
    <path d="M65.5 166L66.5 160.5L72 159L77.5 160.5L78.5 166L76 171.5L68 171.5Z" fill="#f3c8a2"/>
    <circle cx="69.4" cy="165.6" r="1.1" fill="#24163f"/><circle cx="74.8" cy="165.6" r="1.1" fill="#24163f"/>
    <circle cx="67.8" cy="168.6" r="1.6" fill="#f29a8f" opacity=".7"/><circle cx="76.4" cy="168.6" r="1.6" fill="#f29a8f" opacity=".7"/>
    <path d="M70.4 168.8Q72.1 170.6 73.8 168.8" fill="none" stroke="#24163f" stroke-width=".7" stroke-linecap="round"/>
    <path d="M59 161L85 161L79 150L75 140L80 128L86 126L72 134L66 148Z" fill="#3c5cc6"/>
    <rect x="58" y="158" width="28" height="4.5" fill="url(#sbGold)"/>
    <use href="#sbStar" transform="translate(73 148) scale(2.4)" fill="url(#sbGold)"/>
  </g>
  <!-- Pip the cat -->
  <g transform="translate(130 262) scale(1.3) translate(-122 -214)" filter="url(#sbPp)">
    <path d="M129 212C138 210 140 198 134 192" fill="none" stroke="#c96b16" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M114 214L130 214L130 203L125 193L118 195L115 203Z" fill="#ef8d2c"/>
    <path d="M116.5 212.5L121.5 212.5L120.5 202L117 204Z" fill="#fbf4e6"/>
    <path d="M112.5 190L113.5 184.5L113.6 178L117.5 182.5L121 182.5L124.8 178L125 184.5L126 190L119.3 195.5Z" fill="#ef8d2c"/>
    <ellipse cx="116.6" cy="188" rx="1.5" ry="1.8" fill="#7fdc6a"/><ellipse cx="121.9" cy="188" rx="1.5" ry="1.8" fill="#7fdc6a"/>
    <circle cx="116.6" cy="188.2" r=".8" fill="#24163f"/><circle cx="121.9" cy="188.2" r=".8" fill="#24163f"/>
    <path d="M118.4 190.6h1.8l-.9 1z" fill="#f29a8f"/>
  </g>
</svg>
