  <path d="M-6 300V236Q60 228 130 234T260 242T406 236V300Z" fill="#2b1e5e" filter="url(#sbPp)"/>
  <path d="M-6 300V256Q80 250 170 258T406 254V300Z" fill="#1f1548" filter="url(#sbPp)"/>
  <g fill="#170f3c" filter="url(#sbPp)">
    <path d="M352 190L362 204L357 203L366 216L360 215L370 230L344 230L354 215L348 216L357 203L352 204Z" transform="translate(-6 18)"/>
    <path d="M378 176L390 194L384 193L395 210L388 209L400 228L366 228L378 209L371 210L382 193L376 194Z" transform="translate(-2 18)"/>
    <path d="M22 206L30 218L26 217L34 230L14 230L22 217L18 218Z" transform="translate(0 10)"/>
  </g>
  <!-- the gold pages flying off into the night -->
  <use href="#sbPage" transform="translate(196 132) rotate(-18) scale(1.1)"/>
  <use href="#sbPage" transform="translate(236 168) rotate(14)"/>
  <use href="#sbPage" transform="translate(176 96) rotate(26) scale(.85)"/>
  <use href="#sbPage" transform="translate(268 128) rotate(-30) scale(.75)"/>
  <use href="#sbPage" transform="translate(222 76) rotate(-8) scale(.65)"/>
  <!-- the open spellbook on a stone -->
  <g transform="translate(166 238) scale(1.3)" filter="url(#sbPp)">
    <rect x="-10" y="-2" width="22" height="12" fill="#8678b9"/><rect x="2" y="-2" width="10" height="12" fill="#685b9c"/>
    <path d="M-30 -2L0 2L30 -2V-22L0 -18L-30 -22Z" fill="#5e2179"/>
    <path d="M-27 -5L0 -1V-20L-27 -24Z" fill="#fff4d2"/><path d="M27 -5L0 -1V-20L27 -24Z" fill="#fff4d2"/>
    <path d="M-23 -17L-4 -14M-23 -12L-4 -9M4 -14L23 -17M4 -9L23 -12" stroke="#6b48ba" stroke-width="1" stroke-linecap="round"/>
  </g>
  <!-- the little wizard, wand up -->
  <g transform="translate(96 262) scale(1.45) translate(-72 -214)" filter="url(#sbPp)">
    <path d="M59 214L62 196L66 178L72 172L78 178L82 196L86 214Z" fill="#3c5cc6"/>
    <path d="M73 173L78 178L82 196L86 214L74 214Z" fill="#2c459c"/>
