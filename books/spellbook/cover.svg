<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Cover art for "The Little Wizard's Lost Spellbook": cut paper and gold foil,
       drawn by hand in code from the book's own shapes. Original. -->
  <defs>
    <linearGradient id="sbSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#130b33"/><stop offset="1" stop-color="#3b2a78"/></linearGradient>
    <linearGradient id="sbGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a7524"/><stop offset=".28" stop-color="#f7dd86"/><stop offset=".45" stop-color="#c2973a"/>
      <stop offset=".62" stop-color="#fff0b5"/><stop offset=".8" stop-color="#b1882f"/><stop offset="1" stop-color="#e9c96a"/>
    </linearGradient>
    <radialGradient id="sbHalo"><stop offset="0" stop-color="#ffe48a" stop-opacity=".55"/><stop offset="1" stop-color="#ffe48a" stop-opacity="0"/></radialGradient>
    <filter id="sbPp" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="1.4" dy="2.2" stdDeviation="1.8" flood-color="#0d0624" flood-opacity=".5"/>
    </filter>
    <path id="sbStar" d="M0 -1L.32 -.32L1 0L.32 .32L0 1L-.32 .32L-1 0L-.32 -.32Z"/>
    <g id="sbPage">
      <rect x="-8" y="-10.5" width="16" height="21" fill="#fff4d2" filter="url(#sbPp)"/>
      <rect x="-8" y="-10.5" width="16" height="4" fill="url(#sbGold)"/>
      <path d="M-5 -3h10M-5 0h8M-5 3h10M-5 6h6" stroke="#6b48ba" stroke-width=".9" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="400" height="300" fill="url(#sbSky)"/>
  <!-- moon and stars -->
  <circle cx="330" cy="62" r="40" fill="#5d4aa3" filter="url(#sbPp)"/>
  <circle cx="330" cy="62" r="28" fill="url(#sbGold)" filter="url(#sbPp)"/>
  <g fill="url(#sbGold)">
    <use href="#sbStar" transform="translate(40 40) scale(4)"/><use href="#sbStar" transform="translate(96 22) scale(3)"/>
    <use href="#sbStar" transform="translate(150 60) scale(2.4)"/><use href="#sbStar" transform="translate(210 26) scale(3.4)"/>
    <use href="#sbStar" transform="translate(268 110) scale(2.2)"/><use href="#sbStar" transform="translate(30 120) scale(2.6)"/>
    <use href="#sbStar" transform="translate(380 140) scale(2.4)"/><use href="#sbStar" transform="translate(120 104) scale(2)"/>
  </g>
  <!-- far hills and the castle -->
  <path d="M-6 300V176Q40 150 90 168T190 160T290 170T406 158V300Z" fill="#4b3b90" filter="url(#sbPp)"/>
  <g transform="translate(60 18)" filter="url(#sbPp)">
    <rect x="150" y="132" width="86" height="50" fill="#c9b9f0"/><rect x="196" y="132" width="40" height="50" fill="#a08cd9"/>
    <path d="M150 127h5v6h-5zM159 127h5v6h-5zM168 127h5v6h-5zM177 127h5v6h-5zM186 127h5v6h-5zM195 127h5v6h-5zM204 127h5v6h-5zM213 127h5v6h-5zM222 127h5v6h-5zM231 127h5v6h-5z" fill="#c9b9f0"/>
    <path d="M184 182V166L190 160L196 166V182Z" fill="#24163f"/>
    <rect x="138" y="108" width="16" height="74" fill="#c9b9f0"/><rect x="140" y="108" width="14" height="74" fill="#c9b9f0"/><rect x="148" y="108" width="6" height="74" fill="#a08cd9"/>
    <path d="M135.5 109H156.5L146.6 78H145.4Z" fill="#6b48ba"/>
    <rect x="232.5" y="120" width="15" height="62" fill="#c9b9f0"/><rect x="241.5" y="120" width="6" height="62" fill="#a08cd9"/>
    <path d="M230 121H250L240.6 94H239.4Z" fill="#6b48ba"/>
    <rect x="172" y="98" width="12" height="34" fill="#c9b9f0"/><path d="M169.5 99H186.5L178.6 74H177.4Z" fill="#6b48ba"/>
    <rect x="205.5" y="86" width="13" height="46" fill="#c9b9f0"/><path d="M203 87H221L212.6 58H211.4Z" fill="#6b48ba"/>
    <path d="M212 58V48" stroke="#24163f" stroke-width="1.2"/><path d="M212 48L224 51L212 54Z" fill="url(#sbGold)"/>
    <g fill="#ffd76a"><path d="M144 132v-6l2 -2.5l2 2.5v6zM238 140v-6l2 -2.5l2 2.5v6zM176 112v-6l2 -2.5l2 2.5v6zM210 104v-6l2 -2.5l2 2.5v6zM160 155v-7l2 -2.6l2 2.6v7zM172 155v-7l2 -2.6l2 2.6v7zM206 153v-7l2 -2.6l2 2.6v7zM220 157v-7l2 -2.6l2 2.6v7z"/></g>
  </g>
  <!-- cloud band -->
  <path d="M-6 236V214Q10 200 26 212Q42 198 58 211Q76 197 92 210Q110 198 126 212Q144 200 160 211Q178 197 196 210Q214 199 230 212Q248 199 266 210Q284 198 300 211Q318 199 336 212Q354 198 372 210Q390 200 406 212V236Z" fill="#cbbdf2" filter="url(#sbPp)"/>
  <path d="M-6 244V222Q12 210 30 220Q50 208 68 220Q88 209 106 221Q126 210 144 220Q164 208 182 220Q202 210 220 221Q240 209 258 220Q278 208 296 221Q316 210 334 220Q354 209 372 221Q390 210 406 220V244Z" fill="#e6ddfb" filter="url(#sbPp)"/>
