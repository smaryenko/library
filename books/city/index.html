<body>
  <!-- heavy WebGL book: shown at once (scripts are deferred), boot.js fades it out when ready -->
  <div class="book-loading" role="status" aria-live="polite" style="--loading-bg:#2f6f8c;--loading-fg:#eaf2ff"><span class="spinner" aria-hidden="true"></span><span>Loading the book…</span></div>
  <!-- library button, #stage and hint are added by the shared boot.js -->
  <!-- SHARED engine -->
  <script defer src="../../assets/js/stories.js?v=36"></script>
  <script defer src="../../assets/js/pseudo3d-object.js?v=28"></script>
  <script defer src="../../assets/js/music.js?v=20"></script>
  <script defer src="../../assets/js/storybook.js?v=31"></script>
  <!-- three.js, vendored (assets/vendor/three, MIT): one plain script that
       sets window.THREE, so the book works offline and from file:// -->
  <script defer src="../../assets/vendor/three/three.global.min.js?v=1"></script>
  <!-- THIS book: backdrop, roster, then the 3D kit → vehicles → print →
       world → scene (scene.js sets window.BOOK_SCENE before boot.js) -->
  <script defer src="assets/js/backdrop.js?v=3"></script>
  <script defer src="pages.js?v=5"></script>
  <script defer src="assets/js/kit.js?v=4"></script>
  <script defer src="assets/js/vehicles.js?v=10"></script>
  <script defer src="assets/js/print.js?v=4"></script>
  <script defer src="assets/js/world.js?v=10"></script>
  <script defer src="assets/js/scene.js?v=7"></script>
  <script defer src="../../assets/js/boot.js?v=22"></script>
</body>
</html>
