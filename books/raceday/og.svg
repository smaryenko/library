<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Social / Open Graph preview for the Race Day book (1200x630). Original
       vector: cozy living-room floor, orange loop, checkered finish, two toy
       cars, and the title. Not traced from any reference. -->
  <defs>
    <linearGradient id="ogWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#efe7d8"/>
      <stop offset="100%" stop-color="#e3d8c3"/>
    </linearGradient>
    <linearGradient id="ogFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#d9bd92"/>
      <stop offset="100%" stop-color="#c7a677"/>
    </linearGradient>
    <linearGradient id="ogRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7b6b"/>
      <stop offset="50%" stop-color="#e23b2e"/>
      <stop offset="100%" stop-color="#b2271c"/>
    </linearGradient>
    <linearGradient id="ogBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fb0f2"/>
      <stop offset="50%" stop-color="#2f7de0"/>
      <stop offset="100%" stop-color="#235fab"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogWall)"/>
  <rect y="430" width="1200" height="200" fill="url(#ogFloor)"/>
  <rect y="418" width="1200" height="14" fill="#f3efe6"/>

  <!-- sunny window -->
  <rect x="900" y="70" width="230" height="210" rx="8" fill="#f5f1e6"/>
  <rect x="916" y="86" width="198" height="178" rx="5" fill="#bfe6ff"/>
  <circle cx="990" cy="230" r="52" fill="#9ccb7e" opacity="0.7"/>
  <g stroke="#f5f1e6" stroke-width="9">
    <line x1="1015" y1="86" x2="1015" y2="264"/>
    <line x1="916" y1="175" x2="1114" y2="175"/>
  </g>

  <!-- orange loop -->
  <circle cx="250" cy="270" r="140" fill="none" stroke="#f4621f" stroke-width="34"/>
  <circle cx="250" cy="270" r="140" fill="none" stroke="#ff8a4a" stroke-width="11" opacity="0.7"/>
  <path d="M120 440 q80 -34 190 -26 l0 30 q-104 -8 -176 26 z" fill="#f4621f"/>

  <!-- checkered finish band -->
  <g>
    <rect x="80" y="516" width="1040" height="34" fill="#1b1e24"/>
    <g fill="#fff">
      <rect x="80" y="516" width="65" height="17"/><rect x="210" y="516" width="65" height="17"/>
      <rect x="340" y="516" width="65" height="17"/><rect x="470" y="516" width="65" height="17"/>
      <rect x="600" y="516" width="65" height="17"/><rect x="730" y="516" width="65" height="17"/>
      <rect x="860" y="516" width="65" height="17"/><rect x="990" y="516" width="65" height="17"/>
      <rect x="145" y="533" width="65" height="17"/><rect x="275" y="533" width="65" height="17"/>
      <rect x="405" y="533" width="65" height="17"/><rect x="535" y="533" width="65" height="17"/>
      <rect x="665" y="533" width="65" height="17"/><rect x="795" y="533" width="65" height="17"/>
      <rect x="925" y="533" width="65" height="17"/><rect x="1055" y="533" width="65" height="17"/>
    </g>
  </g>

  <!-- two toy cars nose to nose -->
  <g transform="translate(360 470) scale(1.9)">
    <ellipse cx="0" cy="24" rx="52" ry="7" fill="rgba(0,0,0,0.16)"/>
    <path d="M-50 12 q2 -18 26 -22 l20 -2 q14 -16 32 -14 q24 2 30 20 q16 2 16 18
             q0 6 -8 8 l-140 0 q-8 -2 -6 -8 z" fill="url(#ogRed)"/>
    <path d="M-16 -8 q10 -14 30 -8 q12 4 16 12 q-32 -8 -46 -4 z" fill="#b2271c"/>
    <circle cx="-24" cy="22" r="14" fill="#23242a"/><circle cx="-24" cy="22" r="6" fill="#e9edf2"/>
    <circle cx="28" cy="22" r="14" fill="#23242a"/><circle cx="28" cy="22" r="6" fill="#e9edf2"/>
  </g>
  <g transform="translate(560 470) scale(1.9)">
    <ellipse cx="0" cy="24" rx="52" ry="7" fill="rgba(0,0,0,0.16)"/>
    <path d="M-50 12 q2 -18 26 -22 l20 -2 q14 -16 32 -14 q24 2 30 20 q16 2 16 18
             q0 6 -8 8 l-140 0 q-8 -2 -6 -8 z" fill="url(#ogBlue)"/>
    <path d="M-16 -8 q10 -14 30 -8 q12 4 16 12 q-32 -8 -46 -4 z" fill="#235fab"/>
    <circle cx="-24" cy="22" r="14" fill="#23242a"/><circle cx="-24" cy="22" r="6" fill="#e9edf2"/>
    <circle cx="28" cy="22" r="14" fill="#23242a"/><circle cx="28" cy="22" r="6" fill="#e9edf2"/>
  </g>

  <!-- title -->
  <g font-family="'Comic Sans MS','Chalkboard SE','Baloo 2','Fredoka',
                  'Trebuchet MS',system-ui,sans-serif"
     font-weight="800" font-size="104"
     style="paint-order:stroke fill" stroke="#7a3410"
     stroke-width="9" stroke-linejoin="round">
    <text x="70" y="150" fill="#ffd54a" transform="rotate(-3 70 150)">Race</text>
    <text x="70" y="250" fill="#ff8f6b" transform="rotate(2 70 250)">Day!</text>
  </g>
</svg>
