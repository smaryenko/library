<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Shelf-card cover for the Race Day book. Original vector, 4:3 to match the
       card aspect. Cozy living-room floor with an orange loop, a checkered
       finish band, and two chunky toy cars. Not traced from any reference. -->
  <defs>
    <linearGradient id="rcWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#efe7d8"/>
      <stop offset="100%" stop-color="#e3d8c3"/>
    </linearGradient>
    <linearGradient id="rcFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#d9bd92"/>
      <stop offset="100%" stop-color="#c7a677"/>
    </linearGradient>
    <linearGradient id="rcRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7b6b"/>
      <stop offset="50%" stop-color="#e23b2e"/>
      <stop offset="100%" stop-color="#b2271c"/>
    </linearGradient>
    <linearGradient id="rcBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fb0f2"/>
      <stop offset="50%" stop-color="#2f7de0"/>
      <stop offset="100%" stop-color="#235fab"/>
    </linearGradient>
  </defs>

  <!-- room -->
  <rect width="400" height="300" fill="url(#rcWall)"/>
  <rect y="190" width="400" height="110" fill="url(#rcFloor)"/>
  <rect y="182" width="400" height="10" fill="#f3efe6"/>

  <!-- sunny window -->
  <rect x="286" y="34" width="96" height="92" rx="6" fill="#f5f1e6"/>
  <rect x="294" y="42" width="80" height="76" rx="4" fill="#bfe6ff"/>
  <circle cx="320" cy="104" r="22" fill="#9ccb7e" opacity="0.7"/>
  <g stroke="#f5f1e6" stroke-width="4">
    <line x1="334" y1="42" x2="334" y2="118"/>
    <line x1="294" y1="80" x2="374" y2="80"/>
  </g>

  <!-- orange loop -->
  <circle cx="120" cy="120" r="64" fill="none" stroke="#f4621f" stroke-width="16"/>
  <circle cx="120" cy="120" r="64" fill="none" stroke="#ff8a4a" stroke-width="5" opacity="0.7"/>
  <path d="M64 196 q36 -16 84 -12 l0 14 q-46 -4 -78 12 z" fill="#f4621f"/>

  <!-- checkered finish band on the floor -->
  <g>
    <rect x="40" y="226" width="320" height="18" fill="#1b1e24"/>
    <g fill="#fff">
      <rect x="40" y="226" width="20" height="9"/><rect x="80" y="226" width="20" height="9"/>
      <rect x="120" y="226" width="20" height="9"/><rect x="160" y="226" width="20" height="9"/>
      <rect x="200" y="226" width="20" height="9"/><rect x="240" y="226" width="20" height="9"/>
      <rect x="280" y="226" width="20" height="9"/><rect x="320" y="226" width="20" height="9"/>
      <rect x="60" y="235" width="20" height="9"/><rect x="100" y="235" width="20" height="9"/>
      <rect x="140" y="235" width="20" height="9"/><rect x="180" y="235" width="20" height="9"/>
      <rect x="220" y="235" width="20" height="9"/><rect x="260" y="235" width="20" height="9"/>
      <rect x="300" y="235" width="20" height="9"/><rect x="340" y="235" width="20" height="9"/>
    </g>
  </g>

  <!-- two chunky toy cars nose to nose (friendly tie) -->
  <g transform="translate(150 212)">
    <ellipse cx="0" cy="24" rx="52" ry="7" fill="rgba(0,0,0,0.16)"/>
    <path d="M-50 12 q2 -18 26 -22 l20 -2 q14 -16 32 -14 q24 2 30 20 q16 2 16 18
             q0 6 -8 8 l-140 0 q-8 -2 -6 -8 z" fill="url(#rcRed)"/>
    <path d="M-16 -8 q10 -14 30 -8 q12 4 16 12 q-32 -8 -46 -4 z" fill="#b2271c"/>
    <path d="M-12 -6 q10 -8 24 -6 q-16 0 -24 6 z" fill="#cfeaf6"/>
    <circle cx="-24" cy="22" r="14" fill="#23242a"/><circle cx="-24" cy="22" r="6" fill="#e9edf2"/>
    <circle cx="28" cy="22" r="14" fill="#23242a"/><circle cx="28" cy="22" r="6" fill="#e9edf2"/>
  </g>
  <g transform="translate(250 212)">
    <ellipse cx="0" cy="24" rx="52" ry="7" fill="rgba(0,0,0,0.16)"/>
    <path d="M-50 12 q2 -18 26 -22 l20 -2 q14 -16 32 -14 q24 2 30 20 q16 2 16 18
             q0 6 -8 8 l-140 0 q-8 -2 -6 -8 z" fill="url(#rcBlue)"/>
    <path d="M-16 -8 q10 -14 30 -8 q12 4 16 12 q-32 -8 -46 -4 z" fill="#235fab"/>
    <path d="M-12 -6 q10 -8 24 -6 q-16 0 -24 6 z" fill="#cfeaf6"/>
    <circle cx="-24" cy="22" r="14" fill="#23242a"/><circle cx="-24" cy="22" r="6" fill="#e9edf2"/>
    <circle cx="28" cy="22" r="14" fill="#23242a"/><circle cx="28" cy="22" r="6" fill="#e9edf2"/>
  </g>
</svg>
