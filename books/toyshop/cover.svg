<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Cover art for "The Toy Shop After Midnight": hand-written SVG in the book's
       toy-shop style (lamplight, wallpaper, wood shelf, music box, tin soldier,
       Button the rag doll, the toy-sized kid). Original. -->
  <defs>
    <radialGradient id="cvGlow" cx=".5" cy=".05" r=".85"><stop offset="0" stop-color="#ffd59a" stop-opacity=".6"/><stop offset=".45" stop-color="#f0a050" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="cvVig" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#0a0402" stop-opacity=".65"/></radialGradient>
    <linearGradient id="cvGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset=".35" stop-color="#e6b84c"/><stop offset=".7" stop-color="#9a7020"/><stop offset="1" stop-color="#d9a842"/></linearGradient>
    <linearGradient id="cvSteel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f4f7"/><stop offset=".5" stop-color="#c9ccd2"/><stop offset="1" stop-color="#7d828c"/></linearGradient>
    <linearGradient id="cvMirror" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9c8d2"/><stop offset=".5" stop-color="#8fa3b0"/><stop offset="1" stop-color="#5d6f7c"/></linearGradient>
    <linearGradient id="cvRed" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8e1018"/><stop offset=".3" stop-color="#ff5a60"/><stop offset=".42" stop-color="#cf2230"/><stop offset="1" stop-color="#8e1018"/></linearGradient>
    <linearGradient id="cvBlack" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000"/><stop offset=".3" stop-color="#4a4858"/><stop offset=".45" stop-color="#14121a"/><stop offset="1" stop-color="#000"/></linearGradient>
    <radialGradient id="cvSkin" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#ffe4cf"/><stop offset=".5" stop-color="#f2c3a0"/><stop offset="1" stop-color="#d89a76"/></radialGradient>
    <filter id="cvDof"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="cvSoft" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="cvWood" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.45" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0.6 0 0 0 0.62  0.6 0 0 0 0.62  0.6 0 0 0 0.62  0 0 0 0 1" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="multiply" result="m"/><feComposite in="m" in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="cvFelt" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="3" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0.4 0 0 0 0.8  0.4 0 0 0 0.8  0.4 0 0 0 0.8  0 0 0 0 1" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="multiply" result="m"/><feComposite in="m" in2="SourceAlpha" operator="in" result="c"/>
      <feDisplacementMap in="c" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- wall -->
  <rect width="400" height="300" fill="#3a2216"/>
  <g fill="#4a2c1c" opacity=".6"><rect x="6" width="8" height="300"/><rect x="34" width="8" height="300"/><rect x="62" width="8" height="300"/><rect x="90" width="8" height="300"/><rect x="118" width="8" height="300"/><rect x="146" width="8" height="300"/><rect x="174" width="8" height="300"/><rect x="202" width="8" height="300"/><rect x="230" width="8" height="300"/><rect x="258" width="8" height="300"/><rect x="286" width="8" height="300"/><rect x="314" width="8" height="300"/><rect x="342" width="8" height="300"/><rect x="370" width="8" height="300"/></g>
  <rect width="400" height="300" fill="url(#cvGlow)"/>
  <!-- the clock at twelve, top left -->
  <circle cx="58" cy="54" r="30" fill="#a8683a" filter="url(#cvWood)"/><circle cx="58" cy="54" r="24" fill="#f4efe6" stroke="#e6b84c" stroke-width="1.4"/>
  <path d="M58 54V38M58 54V34" stroke="#3a2418" stroke-width="2" stroke-linecap="round"/><circle cx="58" cy="54" r="2" fill="#e6b84c"/>
  <circle cx="58" cy="54" r="38" fill="none" stroke="#ffd59a" stroke-width="1.6" opacity=".45"/><circle cx="58" cy="54" r="46" fill="none" stroke="#ffd59a" stroke-width="1.2" opacity=".25"/>
  <!-- blurred back shelf -->
  <g filter="url(#cvDof)" opacity=".9">
    <rect x="-4" y="130" width="408" height="10" fill="#6e3f20"/><rect x="-4" y="126" width="408" height="5" fill="#a8683a"/>
    <rect x="230" y="96" width="30" height="30" fill="#3d6fa8"/><rect x="236" y="78" width="20" height="18" fill="#d9a43a"/><circle cx="300" cy="110" r="16" fill="#d23a3a"/><rect x="330" y="88" width="20" height="38" fill="#3f8a4f"/>
    <ellipse cx="370" cy="108" rx="14" ry="17" fill="#8a5a32"/><circle cx="370" cy="86" r="10" fill="#8a5a32"/>
  </g>
  <!-- front shelf -->
  <rect x="-4" y="236" width="408" height="10" fill="#c4844f" filter="url(#cvWood)"/><rect x="-4" y="246" width="408" height="18" fill="#a8683a" filter="url(#cvWood)"/>
  <rect x="-4" y="246" width="408" height="1.2" fill="#f0b47a" opacity=".6"/><rect x="-4" y="264" width="408" height="36" fill="#24140c"/>
  <!-- the music box, open -->
  <ellipse cx="200" cy="239" rx="62" ry="5" fill="#1a0d06" opacity=".55" filter="url(#cvSoft)"/>
  <path d="M152 176H248L253 100H147Z" fill="#9a4326" filter="url(#cvWood)"/><path d="M158 171H242L246 107H154Z" fill="#c87a4a"/><path d="M165 165H235L238 114H162Z" fill="url(#cvMirror)"/>
  <path d="M146 192H254L247 176H153Z" fill="#6a2a16"/><rect x="160" y="179" width="48" height="10" rx="5" fill="url(#cvGold)"/>
  <rect x="208" y="179" width="26" height="10" rx="1" fill="url(#cvSteel)"/><path d="M194 180H222M195 182H222M196 184H222M197 186H222" stroke="#c9ccd2" stroke-width=".8"/>
  <path d="M146 192H254V238H146Z" fill="#9a4326" filter="url(#cvWood)"/><rect x="146" y="192" width="108" height="3" fill="#b85a34"/>
  <rect x="192" y="204" width="16" height="16" rx="2.5" fill="url(#cvGold)"/><circle cx="200" cy="210" r="2" fill="#14121a"/>
  <circle cx="166" cy="215" r="10" fill="url(#cvGold)"/><circle cx="166" cy="215" r="8" fill="#2a140a"/><circle cx="166" cy="215" r="6" fill="#e6b84c" stroke="#9a7020"/>
  <path d="M254 192L261 185V233L254 238Z" fill="#6a2a16"/>
  <path d="M265 214C265 204 277 202 277 209C277 212 272 213 268 214C272 215 277 216 277 219C277 226 265 224 265 214Z" fill="url(#cvGold)" stroke="#9a7020" stroke-width=".6"/><rect x="261" y="213" width="5" height="2.4" fill="#9a7020"/>
  <g fill="#e6b84c"><path d="M178 160v-10l6-1.6v10" fill="none" stroke="#e6b84c" stroke-width="1.3"/><ellipse cx="176" cy="160" rx="2.4" ry="1.8"/><ellipse cx="182" cy="158.4" rx="2.4" ry="1.8"/>
    <path d="M214 140v-10l6-1.6v10" fill="none" stroke="#e6b84c" stroke-width="1.3"/><ellipse cx="212" cy="140" rx="2.4" ry="1.8"/><ellipse cx="218" cy="138.4" rx="2.4" ry="1.8"/></g>
  <!-- the tin soldier -->
  <ellipse cx="84" cy="238" rx="15" ry="3.6" fill="#14121a"/>
  <rect x="76" y="218" width="7.2" height="18" rx="2" fill="url(#cvBlack)"/><rect x="85" y="218" width="7.2" height="18" rx="2" fill="url(#cvBlack)"/>
  <rect x="69" y="186" width="30" height="36" rx="6" fill="url(#cvRed)"/><path d="M71 190L97 214M97 190L71 214" stroke="#f4efe6" stroke-width="3.6"/>
  <rect x="69" y="208" width="30" height="4" fill="#14121a"/><rect x="62" y="188" width="8.5" height="26" rx="4" fill="url(#cvRed)"/><rect x="97.5" y="188" width="8.5" height="26" rx="4" fill="url(#cvRed)"/>
  <circle cx="66" cy="215" r="3.6" fill="#f2c3a0"/><circle cx="102" cy="215" r="3.6" fill="#f2c3a0"/>
  <circle cx="84" cy="178" r="9.5" fill="url(#cvSkin)"/><circle cx="80.5" cy="178.5" r="1.4" fill="#14121a"/><circle cx="87.5" cy="178.5" r="1.4" fill="#14121a"/><path d="M80.8 182.4Q84 185.4 87.2 182.4" stroke="#8e1018" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <path d="M73 176C71 160 73 142 84 140C95 142 97 160 95 176Z" fill="url(#cvBlack)"/><path d="M77 170C76 160 77 150 81 145" stroke="#fff" stroke-width="2" opacity=".35" fill="none" stroke-linecap="round"/><path d="M74.5 175Q84 188 93.5 175" stroke="#e6b84c" stroke-width="1.3" fill="none"/>
  <rect x="56" y="198.6" width="6" height="2" fill="#7d828c"/><path d="M57 199.6C57 192 48 190.5 48 195.5C48 197.6 51.5 198.8 54 199.6C51.5 200.4 48 201.6 48 203.7C48 208.7 57 207.2 57 199.6Z" fill="url(#cvSteel)" stroke="#7d828c" stroke-width=".6"/>
  <!-- Button the rag doll, sitting on the shelf edge -->
  <g filter="url(#cvFelt)"><rect x="316" y="228" width="9" height="44" rx="4" fill="#fbf6ee"/><rect x="330" y="228" width="9" height="44" rx="4" fill="#fbf6ee"/></g>
  <g fill="#d8393f" opacity=".9"><rect x="316" y="233" width="9" height="3.4"/><rect x="316" y="241" width="9" height="3.4"/><rect x="316" y="249" width="9" height="3.4"/><rect x="316" y="257" width="9" height="3.4"/><rect x="330" y="233" width="9" height="3.4"/><rect x="330" y="241" width="9" height="3.4"/><rect x="330" y="249" width="9" height="3.4"/><rect x="330" y="257" width="9" height="3.4"/></g>
  <ellipse cx="320.5" cy="273" rx="6.6" ry="4.4" fill="#14121a"/><ellipse cx="334.5" cy="273" rx="6.6" ry="4.4" fill="#14121a"/>
  <path d="M307 238C305 222 311 204 325 202C339 204 345 222 343 238Z" fill="#3fa59a" filter="url(#cvFelt)"/>
  <path d="M309 212H341M308 218H342M308 224H342M307.5 230H342.5" stroke="#7fd0c4" stroke-width="1.6" opacity=".7"/>
  <g fill="#fbf6ee"><circle cx="313" cy="204.5" r="3"/><circle cx="317" cy="206" r="3"/><circle cx="321" cy="206.8" r="3"/><circle cx="325" cy="207" r="3"/><circle cx="329" cy="206.8" r="3"/><circle cx="333" cy="206" r="3"/><circle cx="337" cy="204.5" r="3"/></g>
  <rect x="301" y="208" width="8" height="22" rx="4" fill="#f2c3a0" transform="rotate(14 305 208)"/><rect x="341" y="190" width="8" height="22" rx="4" fill="#f2c3a0" transform="rotate(-150 345 208)"/>
  <g stroke-width="2.6" fill="none" stroke-linecap="round"><path d="M310 180q-6 4 -4 14" stroke="#e8742a"/><path d="M309 184q-8 6 -5 16" stroke="#b9521a"/><path d="M340 180q6 4 4 14" stroke="#e8742a"/><path d="M341 184q8 6 5 16" stroke="#b9521a"/><path d="M311 176Q325 156 339 176" stroke="#e8742a" stroke-width="5"/><path d="M314 172q4 -6 8 -4M324 168q5 -3 9 2" stroke="#b9521a"/></g>
  <circle cx="325" cy="188" r="14.5" fill="#f2c3a0" filter="url(#cvFelt)"/>
  <ellipse cx="320" cy="187" rx="1.7" ry="2.1" fill="#3a2418"/><circle cx="319.5" cy="186.2" r=".55" fill="#fff"/><ellipse cx="330" cy="187" rx="1.7" ry="2.1" fill="#3a2418"/><circle cx="329.5" cy="186.2" r=".55" fill="#fff"/>
  <path d="M318 182.6Q320 181.6 322 182.6M328 182.6Q330 181.6 332 182.6" stroke="#b9521a" stroke-width=".7" fill="none" stroke-linecap="round"/>
  <path d="M321.6 192.6Q325 195.6 328.4 192.6" stroke="#c4505a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <circle cx="317.5" cy="191.5" r="2" fill="#ee8f86" opacity=".3"/><circle cx="332.5" cy="191.5" r="2" fill="#ee8f86" opacity=".3"/>
  <!-- the toy-sized kid in pyjamas -->
  <ellipse cx="128" cy="238" rx="10" ry="2.6" fill="#1a0d06" opacity=".5" filter="url(#cvSoft)"/>
  <g transform="translate(128 237) scale(.7)">
    <rect x="-8.5" y="-31" width="7.5" height="27" rx="3" fill="#5b86c4"/><rect x="1" y="-31" width="7.5" height="27" rx="3" fill="#5b86c4"/>
    <ellipse cx="-4.75" cy="-2.8" rx="5.6" ry="3.1" fill="#8a3a5a"/><ellipse cx="4.75" cy="-2.8" rx="5.6" ry="3.1" fill="#8a3a5a"/>
    <rect x="-17" y="-53" width="6.5" height="19" rx="3.2" fill="#5b86c4" transform="rotate(160 -13.75 -51)"/><circle cx="-13.75" cy="-33" r="3.2" fill="#f2c3a0" transform="rotate(160 -13.75 -51)"/>
    <rect x="-12" y="-55" width="24" height="27" rx="7" fill="#5b86c4"/><path d="M-7.5 -53V-30M-2.5 -53V-30M2.5 -53V-30M7.5 -53V-30" stroke="#b4cdee" stroke-width="1.3" opacity=".55"/><path d="M-6 -55L0 -48.5L6 -55Z" fill="#b4cdee"/>
    <rect x="10.5" y="-53" width="6.5" height="19" rx="3.2" fill="#5b86c4" transform="rotate(-160 13.75 -51)"/><circle cx="13.75" cy="-33" r="3.2" fill="#f2c3a0" transform="rotate(-160 13.75 -51)"/>
    <circle cx="0" cy="-67" r="13" fill="url(#cvSkin)"/>
    <path d="M-13.4 -66C-15 -84 15 -84 13.4 -66C12.4 -71 9.6 -74 5 -75C1.5 -71.5 -5.5 -71 -9.5 -73.5C-11.5 -71.5 -12.8 -69 -13.4 -66Z" fill="#6a3a1e"/>
    <ellipse cx="-4.6" cy="-65.5" rx="1.6" ry="2" fill="#3a2418"/><ellipse cx="4.6" cy="-65.5" rx="1.6" ry="2" fill="#3a2418"/><circle cx="-5.1" cy="-66.3" r=".55" fill="#fff"/><circle cx="4.1" cy="-66.3" r=".55" fill="#fff"/>
    <ellipse cx="0" cy="-60.4" rx="1.8" ry="1.5" fill="#8a3030"/>
  </g>
  <!-- dust in the lamplight, vignette -->
  <g fill="#ffd59a"><circle cx="170" cy="40" r=".9" opacity=".6"/><circle cx="210" cy="70" r=".7" opacity=".5"/><circle cx="240" cy="30" r="1" opacity=".5"/><circle cx="190" cy="96" r=".7" opacity=".4"/><circle cx="150" cy="80" r=".8" opacity=".5"/></g>
  <rect width="400" height="300" fill="url(#cvVig)"/>
</svg>
