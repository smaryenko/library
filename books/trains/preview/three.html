<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const V3 = THREE.Vector3;
const rand = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })(); // seeded

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.domElement.setAttribute('aria-label', '3D steam locomotive. Tap to make it chug and puff smoke.');
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe3f1);
scene.fog = new THREE.Fog(0xcfe3f1, 25, 60);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 200);
camera.position.set(7, 4.2, 11);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.8, 1.5, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 3; controls.maxDistance = 22;

const sun = new THREE.DirectionalLight(0xfff1dc, 2.2);
sun.position.set(6, 10, 5);

sun.shadow.mapSize.set(2048, 2048);

Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9 });

// ---------- procedural textures ----------
function noiseTex(size, lo, hi, streaks) { // grime / wear for roughness maps
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), img = g.createImageData(size, size);
  for (let i = 0; i < size * size; i++) {
    const y = Math.floor(i / size);
    let v = lo + rand() * (hi - lo);
    if (streaks) v += Math.sin(y * 0.15 + rand() * 0.4) * 18;   // vertical rain streaks
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = Math.max(0, Math.min(255, v));
    img.data[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 3);
  return t;
}
const grime = noiseTex(256, 120, 220, true);
const rust = noiseTex(256, 150, 255, false);

function label(text, w, h, fg, bg, font) { // painted lettering / number plates
  const c = document.createElement('canvas'); c.width = 512; c.height = Math.round(512 * h / w);
  const g = c.getContext('2d');
  if (bg) { g.fillStyle = bg; g.fillRect(0, 0, c.width, c.height); }
  g.fillStyle = fg; g.font = font || `bold ${c.height * 0.62}px Georgia, serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, c.width / 2, c.height / 2 + 4);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  // matte-ish so the environment reflection doesn't smear the lettering; polygonOffset keeps decals on top
  return new THREE.MeshStandardMaterial({ map: tex, transparent: !bg, metalness: 0.2, roughness: 0.5,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
}

// ---------- materials (livery cfg: separate axes) ----------
const livery = { body: 0x1f5a3a, trim: 0xb8862b, iron: 0x222326, wheel: 0x9c2a1f };
const M = {
  paint: new THREE.MeshPhysicalMaterial({ color: livery.body, metalness: 0.3, roughness: 0.38, roughnessMap: grime, clearcoat: 0.8, clearcoatRoughness: 0.25 }),
  brass: new THREE.MeshStandardMaterial({ color: livery.trim, metalness: 1, roughness: 0.22 }),
  copper: new THREE.MeshStandardMaterial({ color: 0xb5643a, metalness: 1, roughness: 0.3 }),
  iron:  new THREE.MeshStandardMaterial({ color: livery.iron, metalness: 0.7, roughness: 0.55, roughnessMap: rust }),
  black: new THREE.MeshStandardMaterial({ color: 0x0d0d0e, metalness: 0.4, roughness: 0.6 }),
  steel: new THREE.MeshStandardMaterial({ color: 0xc4c7cb, metalness: 1, roughness: 0.25 }),
  red:   new THREE.MeshPhysicalMaterial({ color: livery.wheel, metalness: 0.2, roughness: 0.42, roughnessMap: grime, clearcoat: 0.6 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0x9fb8c8, metalness: 0, roughness: 0.05, transmission: 0.6, transparent: true, opacity: 0.55 }),
  lamp:  new THREE.MeshStandardMaterial({ color: 0xfff2c4, emissive: 0xffd27a, emissiveIntensity: 0.6, roughness: 0.1 }),
  coal:  new THREE.MeshStandardMaterial({ color: 0x141414, metalness: 0.2, roughness: 0.45 }),
  dark:  new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 1 }),
  wood:  new THREE.MeshStandardMaterial({ color: 0x5a3d26, roughness: 0.9, roughnessMap: grime }),
  gravel: new THREE.MeshStandardMaterial({ color: 0x8a7d6c, roughness: 1 }),
  grass: new THREE.MeshStandardMaterial({ color: 0x6f9a4a, roughness: 1 })
};
M.ring = M.red.clone(); M.ring.side = THREE.DoubleSide;
M.tyre = M.steel.clone(); M.tyre.side = THREE.DoubleSide;

// ---------- geometry helpers ----------
function mesh(geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  return m;
}
const cylX = (r, len, seg = 40) => new THREE.CylinderGeometry(r, r, len, seg).rotateZ(Math.PI / 2); // axis along x
const cylZ = (r, len, seg = 40) => new THREE.CylinderGeometry(r, r, len, seg).rotateX(Math.PI / 2); // axis along z
function pipe(a, b, r, mat) { // cylinder between two points
  const A = new V3(...a), B = new V3(...b);
  const m = mesh(new THREE.CylinderGeometry(r, r, A.distanceTo(B), 12), mat);
  m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new V3(0, 1, 0), B.clone().sub(A).normalize());
  return m;
}
function path(pts, r, mat, parent) { for (let i = 1; i < pts.length; i++) parent.add(pipe(pts[i - 1], pts[i], r, mat)); }
function instanced(geo, mat, positions, parent, scaleJitter = 0, colors) { // rivets, coal, ballast
  const im = new THREE.InstancedMesh(geo, mat, positions.length);
  const o = new THREE.Object3D();
  positions.forEach((p, i) => {
    o.position.set(...p);
    o.rotation.set(rand() * 6, rand() * 6, rand() * 6);
    o.scale.setScalar(1 + (rand() - 0.5) * scaleJitter);
    o.updateMatrix(); im.setMatrixAt(i, o.matrix);
    if (colors) im.setColorAt(i, colors(i));
  });
  im.castShadow = true; im.receiveShadow = true;
  parent.add(im); return im;
}

// ---------- ground + track ----------
scene.add(mesh(new THREE.CircleGeometry(40, 64).rotateX(-Math.PI / 2), M.grass, 0, -0.01, 0));
scene.add(mesh(new THREE.BoxGeometry(60, 0.18, 3.2), M.gravel, 0, 0.05, 0));
{
  const ties = [], plates = [], spikes = [], stones = [];
  for (let x = -30; x <= 30; x += 0.75) {
    ties.push([x + (rand() - 0.5) * 0.04, 0.19, (rand() - 0.5) * 0.05]);
    for (const z of [-0.72, 0.72]) {
      plates.push([x, 0.265, z]);
      spikes.push([x - 0.06, 0.29, z - 0.1], [x + 0.06, 0.29, z + 0.1]);
    }
  }
  const tieIM = new THREE.InstancedMesh(new THREE.BoxGeometry(0.3, 0.14, 2.4), M.wood, ties.length);
  const o = new THREE.Object3D();
  ties.forEach((p, i) => { o.position.set(...p); o.rotation.set(0, (rand() - 0.5) * 0.03, 0); o.updateMatrix(); tieIM.setMatrixAt(i, o.matrix); });
  tieIM.castShadow = tieIM.receiveShadow = true; scene.add(tieIM);
  const plateIM = new THREE.InstancedMesh(new THREE.BoxGeometry(0.22, 0.02, 0.3), M.iron, plates.length);
  plates.forEach((p, i) => { o.position.set(...p); o.rotation.set(0, 0, 0); o.updateMatrix(); plateIM.setMatrixAt(i, o.matrix); });
  plateIM.receiveShadow = true; scene.add(plateIM);
  const spikeIM = new THREE.InstancedMesh(new THREE.BoxGeometry(0.04, 0.04, 0.04), M.iron, spikes.length);
  spikes.forEach((p, i) => { o.position.set(...p); o.updateMatrix(); spikeIM.setMatrixAt(i, o.matrix); });
  scene.add(spikeIM);
  // ballast stones, mixed greys / browns
  for (let i = 0; i < 2600; i++) stones.push([(rand() - 0.5) * 40, 0.15 + rand() * 0.04, (rand() - 0.5) * 3.1]);
  const tint = new THREE.Color();
  instanced(new THREE.DodecahedronGeometry(0.05, 0), new THREE.MeshStandardMaterial({ roughness: 1 }), stones, scene, 0.9,
    () => tint.setHSL(0.08 + rand() * 0.04, 0.12, 0.3 + rand() * 0.3).clone());
  // I-profile rails: head, web, foot
  for (const z of [-0.72, 0.72]) {
    scene.add(mesh(new THREE.BoxGeometry(60, 0.06, 0.1), M.steel, 0, 0.36, z));
    scene.add(mesh(new THREE.BoxGeometry(60, 0.08, 0.035), M.iron, 0, 0.3, z));
    scene.add(mesh(new THREE.BoxGeometry(60, 0.025, 0.17), M.iron, 0, 0.257, z));
    for (let x = -27; x <= 27; x += 9) { // fishplates at rail joints
      for (const s of [-1, 1]) scene.add(mesh(new THREE.BoxGeometry(0.5, 0.07, 0.02), M.iron, x, 0.3, z + s * 0.03));
    }
  }
}

// ---------- locomotive ----------
const loco = new THREE.Group();
scene.add(loco);
const R = 0.6;            // driver radius
const AXLE_Y = 0.39 + R;  // wheel sits on the rail top
const WHEEL_Z = 0.72;
const CRANK = 0.18; // small enough that pins + rod bosses stay below the running board (y 1.25)
const DRIVERS_X = [-1.5, -0.1, 1.3];
const wheels = [];
const rivets = [];        // [x,y,z] in loco space, one InstancedMesh at the end

// spoked wheel: open tyre, rim ring, tapered spokes, hub, counterweight, optional crank pin
function wheel(r, spokes, side, pinPhase) {
  const g = new THREE.Group();
  g.add(mesh(new THREE.CylinderGeometry(r, r, 0.14, 56, 1, true).rotateX(Math.PI / 2), M.tyre));
  for (const z of [-0.07, 0.07]) g.add(mesh(new THREE.RingGeometry(r * 0.84, r, 56), M.tyre, 0, 0, z));
  g.add(mesh(new THREE.RingGeometry(r, r + 0.05, 56), M.tyre, 0, 0, -side * 0.06)); // flange, inner side
  g.add(mesh(new THREE.TorusGeometry(r * 0.83, 0.045, 10, 56), M.red));
  g.add(mesh(cylZ(r * 0.2, 0.2), M.red));
  g.add(mesh(cylZ(r * 0.09, 0.26), M.steel));                                      // axle end
  for (let i = 0; i < spokes; i++) {
    const s = mesh(new THREE.CylinderGeometry(0.022, 0.04, r * 0.65, 8), M.red);
    const a = (i / spokes) * Math.PI * 2;
    s.position.set(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5, 0);
    s.rotation.z = a - Math.PI / 2;
    g.add(s);
  }
  if (pinPhase !== undefined) {
    // counterweight crescent opposite the crank pin
    const thC = Math.atan2(-Math.cos(pinPhase), Math.sin(pinPhase));
    g.add(mesh(new THREE.CylinderGeometry(r * 0.8, r * 0.8, 0.1, 24, 1, false, thC - 0.35 * Math.PI, 0.7 * Math.PI).rotateX(Math.PI / 2), M.red));
    const pin = mesh(cylZ(0.06, 0.32, 16), M.steel, Math.cos(pinPhase) * CRANK, Math.sin(pinPhase) * CRANK, side * 0.12);
    g.add(pin, mesh(cylZ(0.1, 0.1, 16), M.red, pin.position.x, pin.position.y, side * 0.04)); // crank boss
  }
  return g;
}

// --- boiler, bands, smokebox ---
loco.add(mesh(cylX(0.78, 3.6, 64), M.paint, 0.5, 2.05, 0));
loco.add(mesh(cylX(0.82, 0.9, 64), M.iron, 2.55, 2.05, 0));
loco.add(mesh(cylX(0.84, 0.06, 64), M.iron, 2.12, 2.05, 0));
for (const x of [-1.15, -0.25, 0.5, 1.25, 1.95]) {
  loco.add(mesh(cylX(0.795, 0.06, 64), M.brass, x, 2.05, 0));
  for (let k = 0; k < 18; k++) { const a = (k / 17) * Math.PI * 1.1 - 0.05; rivets.push([x, 2.05 + Math.sin(a) * 0.8, Math.cos(a) * 0.8]); }
}
for (let k = 0; k < 28; k++) { const a = (k / 28) * Math.PI * 2; rivets.push([2.12, 2.05 + Math.sin(a) * 0.85, Math.cos(a) * 0.85]); }

// smokebox door: plate, hinge straps, dart handle, number plate
loco.add(mesh(cylX(0.72, 0.08, 64), M.iron, 3.03, 2.05, 0));
loco.add(mesh(new THREE.TorusGeometry(0.72, 0.03, 8, 64).rotateY(Math.PI / 2), M.steel, 3.07, 2.05, 0));
for (const y of [1.78, 2.32]) {
  loco.add(mesh(new THREE.BoxGeometry(0.03, 0.07, 1.05), M.steel, 3.08, y, 0.12));
  loco.add(mesh(cylY(0.04, 0.12), M.steel, 3.08, y, -0.45));
}
function cylY(r, h) { return new THREE.CylinderGeometry(r, r, h, 16); }
loco.add(mesh(cylX(0.05, 0.22, 16), M.steel, 3.16, 2.05, 0));
loco.add(mesh(new THREE.BoxGeometry(0.03, 0.03, 0.34), M.steel, 3.27, 2.05, 0));
const numPlate = mesh(new THREE.CircleGeometry(0.16, 40).rotateY(Math.PI / 2), label('2', 1, 1, '#f3d27a', '#1b1b1b'), 3.085, 2.52, 0);
loco.add(numPlate, mesh(new THREE.TorusGeometry(0.16, 0.015, 8, 40).rotateY(Math.PI / 2), M.brass, 3.09, 2.52, 0));

// chimney: tapered stack, flared cap, copper-capped rim
loco.add(mesh(new THREE.CylinderGeometry(0.26, 0.2, 0.9, 40), M.iron, 2.55, 3.15, 0));
loco.add(mesh(new THREE.CylinderGeometry(0.4, 0.27, 0.18, 40), M.iron, 2.55, 2.75, 0));
loco.add(mesh(new THREE.CylinderGeometry(0.34, 0.26, 0.14, 40), M.iron, 2.55, 3.62, 0));
loco.add(mesh(new THREE.TorusGeometry(0.33, 0.035, 8, 40).rotateX(Math.PI / 2), M.copper, 2.55, 3.69, 0));
loco.add(mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.05, 32), M.dark, 2.55, 3.67, 0));

// headlamp box ahead of the chimney
const lampBox = new THREE.Group();
lampBox.add(mesh(new THREE.BoxGeometry(0.38, 0.42, 0.42), M.black));
lampBox.add(mesh(new THREE.BoxGeometry(0.42, 0.06, 0.48), M.black, 0, 0.24, 0));

lampBox.add(mesh(new THREE.TorusGeometry(0.16, 0.025, 8, 32).rotateY(Math.PI / 2), M.brass, 0.215, 0, 0));
for (const z of [-0.22, 0.22]) lampBox.add(mesh(new THREE.BoxGeometry(0.25, 0.25, 0.02), label('2', 1, 1, '#111', '#e9e3d0'), 0, -0.02, z));
lampBox.position.set(3.0, 3.06, 0);

loco.add(mesh(new THREE.BoxGeometry(0.4, 0.18, 0.36), M.iron, 3.0, 2.8, 0));

// domes: steam dome (brass), sand dome (paint, brass ring)
function dome(x, r, matTop, matBase) {
  loco.add(mesh(new THREE.CylinderGeometry(r, r * 1.15, 0.32, 40), matBase, x, 2.88, 0));
  loco.add(mesh(new THREE.SphereGeometry(r, 40, 16, 0, Math.PI * 2, 0, Math.PI / 2), matTop, x, 3.03, 0));
  loco.add(mesh(new THREE.TorusGeometry(r * 1.02, 0.025, 8, 40).rotateX(Math.PI / 2), M.brass, x, 3.03, 0));
}
dome(0.6, 0.33, M.brass, M.brass);
dome(-0.35, 0.27, M.paint, M.paint);

// bell in a yoke
const bell = new THREE.Group();
bell.add(mesh(new THREE.LatheGeometry([[0.0, 0.26], [0.06, 0.25], [0.1, 0.18], [0.12, 0.06], [0.17, -0.02], [0.16, -0.05], [0.0, -0.04]].map(p => new THREE.Vector2(...p)), 32), M.brass));
bell.position.set(0, -0.08, 0);

loco.add(bellPivot);
for (const z of [-0.2, 0.2]) loco.add(mesh(new THREE.BoxGeometry(0.06, 0.42, 0.04), M.brass, 1.65, 3.05, z));
loco.add(mesh(new THREE.BoxGeometry(0.1, 0.05, 0.5), M.brass, 1.65, 2.84, 0));

// whistle + safety valves on the firebox
loco.add(mesh(cylY(0.03, 0.22), M.brass, -1.05, 2.95, 0.12));
loco.add(mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.28, 24), M.brass, -1.05, 3.18, 0.12));
loco.add(mesh(new THREE.SphereGeometry(0.06, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), M.brass, -1.05, 3.32, 0.12));
for (const z of [-0.12, 0.12]) {
  loco.add(mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.22, 24), M.brass, -0.8, 2.92, z));
  loco.add(mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.08, 12), M.brass, -0.8, 3.06, z));
}

// handrails + stanchions along the boiler
for (const s of [-1, 1]) {
  loco.add(pipe([-1.15, 2.62, s * 0.86], [2.95, 2.62, s * 0.86], 0.018, M.steel));
  for (const x of [-1.0, 0.0, 1.0, 2.0, 2.85]) loco.add(pipe([x, 2.62, s * 0.86], [x, 2.42, s * 0.72], 0.014, M.steel));
}
loco.add(pipe([3.08, 2.62, -0.5], [3.08, 2.62, 0.5], 0.018, M.steel)); // across smokebox

}

for (let z = -0.85; z <= 0.86; z += 0.17) rivets.push([3.24, 1.15, z], [3.24, 0.86, z]);
loco.add(mesh(new THREE.BoxGeometry(0.3, 0.16, 0.22), M.black, 3.35, 0.95, 0));         // coupler

// slatted pilot (cowcatcher)
for (let z = -0.9; z <= 0.91; z += 0.15) loco.add(pipe([3.22, 0.8, z], [3.95, 0.43, z * 0.3], 0.025, M.red));
loco.add(pipe([3.95, 0.43, -0.3], [3.95, 0.43, 0.3], 0.035, M.red));
loco.add(pipe([3.24, 0.8, -0.92], [3.95, 0.43, -0.3], 0.035, M.red));
loco.add(pipe([3.24, 0.8, 0.92], [3.95, 0.43, 0.3], 0.035, M.red));
loco.add(pipe([3.24, 0.8, -0.92], [3.24, 0.8, 0.92], 0.035, M.red));
// marker lamps on the buffer beam corners
for (const z of [-0.85, 0.85]) {

  loco.add(mesh(new THREE.CircleGeometry(0.045, 16).rotateY(Math.PI / 2), M.lamp, 3.275, 1.36, z));

// --- cylinders, steam pipes, slide bars ---
for (const s of [-1, 1]) {
  const z = s * 0.95;
  loco.add(mesh(cylX(0.32, 0.9), M.paint, 2.5, 1.0, z));
  for (const x of [2.05, 2.95]) loco.add(mesh(cylX(0.34, 0.06), M.steel, x, 1.0, z));
  loco.add(mesh(new THREE.BoxGeometry(0.75, 0.22, 0.4), M.paint, 2.5, 1.4, s * 0.88));   // steam chest
  loco.add(pipe([2.55, 1.8, s * 0.7], [2.5, 1.5, s * 0.92], 0.09, M.paint));             // outside steam pipe

}

// --- sandpipes from the sand dome, air pump, air reservoir ---
for (const s of [-1, 1]) path([[-0.35, 2.8, s * 0.22], [-0.35, 2.45, s * 0.8], [-0.4, 1.35, s * 0.86], [0.55, 0.5, s * 0.8]], 0.022, M.iron, loco);
const pump = new THREE.Group();
pump.add(mesh(cylY(0.13, 0.42), M.iron, 0, 0.22, 0), mesh(cylY(0.13, 0.42), M.iron, 0, -0.22, 0));
pump.add(mesh(cylY(0.15, 0.04), M.brass, 0, 0, 0), mesh(cylY(0.15, 0.04), M.brass, 0, 0.44, 0), mesh(cylY(0.15, 0.04), M.brass, 0, -0.44, 0));
pump.position.set(1.4, 1.78, 0.86); loco.add(pump);
path([[1.4, 2.25, 0.86], [1.4, 2.4, 0.7], [0.9, 2.5, 0.6]], 0.025, M.copper, loco);
loco.add(mesh(cylX(0.17, 1.6), M.iron, 0.1, 1.48, -0.8));
for (const x of [-0.7, 0.9]) loco.add(mesh(cylX(0.18, 0.04), M.steel, x, 1.48, -0.8));
loco.add(pipe([-1.1, 1.85, -0.75], [1.9, 1.85, -0.75], 0.03, M.copper));                  // injector feed pipe
loco.add(pipe([-1.1, 1.85, 0.79], [0.9, 1.6, 0.79], 0.03, M.copper));

// --- cab: walls, arched roof, windows, door opening, number plate, steps ---
const cab = new THREE.Group();
cab.add(mesh(new THREE.BoxGeometry(1.4, 1.9, 1.9), M.paint));
const roof = mesh(new THREE.CylinderGeometry(1.9, 1.9, 1.75, 48, 1, true, Math.PI / 2 - 0.6, 1.2).rotateZ(Math.PI / 2), M.black.clone(), 0, -0.62, 0);
roof.material.side = THREE.DoubleSide; cab.add(roof);
cab.add(mesh(new THREE.BoxGeometry(1.75, 0.05, 0.08), M.black, 0, 1.28, 0));                     // roof vent rib
cab.add(mesh(new THREE.BoxGeometry(0.45, 0.12, 0.6), M.black, -0.1, 1.33, 0));                   // roof ventilator
for (const s of [-1, 1]) {
  const z = s * 0.952;
  cab.add(mesh(new THREE.BoxGeometry(0.82, 0.72, 0.012), M.brass, 0.15, 0.35, z));
  cab.add(mesh(new THREE.BoxGeometry(0.7, 0.6, 0.02), M.glass, 0.15, 0.35, s * 0.958));
  cab.add(mesh(new THREE.BoxGeometry(0.02, 0.6, 0.025), M.brass, 0.15, 0.35, s * 0.96));        // window mullion
  cab.add(mesh(new THREE.BoxGeometry(0.36, 1.3, 0.02), M.dark, -0.47, -0.1, s * 0.955));        // door opening
  // plate sits clearly in front of its brass frame (no shared depth = no z-fighting)
  const plate = mesh(new THREE.PlaneGeometry(0.6, 0.2), label('No. 2', 0.6, 0.2, '#f3d27a', '#1b1b1b'), 0.15, -0.3, s * 0.975);
  if (s < 0) plate.rotation.y = Math.PI;
  plate.castShadow = false;
  cab.add(plate, mesh(new THREE.BoxGeometry(0.66, 0.26, 0.02), M.brass, 0.15, -0.3, s * 0.96));
  for (let x = -0.65; x <= 0.66; x += 0.13) rivets.push([-1.95 + x, 1.32, s * 0.96], [-1.95 + x, 3.18, s * 0.96]);
  for (let y = 1.32; y <= 3.19; y += 0.13) rivets.push([-1.95 + 0.68, y, s * 0.96]);
  cab.add(pipe([-0.27, -0.7, s * 1.0], [-0.27, 0.55, s * 1.0], 0.018, M.steel));                // grab rails
  cab.add(pipe([-0.67, -0.7, s * 1.0], [-0.67, 0.55, s * 1.0], 0.018, M.steel));
}
for (const z of [-0.5, 0.5]) { // spectacle windows on the cab front
  cab.add(mesh(new THREE.CircleGeometry(0.17, 32).rotateY(Math.PI / 2), M.glass, 0.705, 0.55, z));
  cab.add(mesh(new THREE.TorusGeometry(0.17, 0.028, 8, 32).rotateY(Math.PI / 2), M.brass, 0.71, 0.55, z));
}
cab.position.set(-1.95, 2.25, 0);
loco.add(cab);
// engineer silhouette leaning at the window
const engineer = new THREE.Group();
engineer.add(mesh(new THREE.SphereGeometry(0.14, 20, 14), new THREE.MeshStandardMaterial({ color: 0xd9a37f, roughness: 0.7 }), 0, 0.12, 0));
engineer.add(mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.12, 20), new THREE.MeshStandardMaterial({ color: 0x2f4b7a, roughness: 0.8 }), 0, 0.27, 0));
engineer.add(mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.02, 20), new THREE.MeshStandardMaterial({ color: 0x2f4b7a, roughness: 0.8 }), 0.06, 0.22, 0));
engineer.add(mesh(new THREE.CylinderGeometry(0.17, 0.22, 0.5, 20), new THREE.MeshStandardMaterial({ color: 0x3a5a8c, roughness: 0.9 }), 0, -0.2, 0));
engineer.position.set(-1.8, 2.55, 0.62);
loco.add(engineer);
// cab steps
for (const s of [-1, 1]) {
  for (const y of [0.55, 0.85]) loco.add(mesh(new THREE.BoxGeometry(0.34, 0.03, 0.2), M.black, -2.45, y, s * 1.02));
  loco.add(pipe([-2.6, 1.25, s * 1.02], [-2.6, 0.5, s * 1.02], 0.02, M.black));
  loco.add(pipe([-2.3, 1.25, s * 1.02], [-2.3, 0.5, s * 1.02], 0.02, M.black));
}

// --- wheels: drivers (with crank pins), pony truck, brakes, axleboxes, springs ---
for (const s of [-1, 1]) {
  const phase = s > 0 ? 0 : Math.PI / 2; // quartered cranks, like a real loco
  for (const x of DRIVERS_X) {
    const w = wheel(R, 14, s, phase); w.position.set(x, AXLE_Y, s * WHEEL_Z); loco.add(w); wheels.push({ w, r: R });
    loco.add(mesh(new THREE.BoxGeometry(0.1, 0.42, 0.12), M.iron, x - 0.68, AXLE_Y - 0.05, s * WHEEL_Z)); // brake shoe
    loco.add(pipe([x - 0.68, AXLE_Y + 0.15, s * 0.6], [x - 0.68, 1.2, s * 0.6], 0.025, M.iron));          // hanger
    loco.add(mesh(new THREE.BoxGeometry(0.26, 0.3, 0.12), M.iron, x, AXLE_Y, s * 0.6));                   // axlebox
    for (let k = 0; k < 4; k++) loco.add(mesh(new THREE.BoxGeometry(0.62 - k * 0.1, 0.025, 0.08), M.steel, x, AXLE_Y + 0.2 + k * 0.03, s * 0.6));
  }
  const lw = wheel(0.38, 10, s); lw.position.set(2.65, 0.39 + 0.38, s * WHEEL_Z); loco.add(lw); wheels.push({ w: lw, r: 0.38 });
  loco.add(mesh(new THREE.BoxGeometry(0.22, 0.24, 0.1), M.iron, 2.65, 0.77, s * 0.6));
}
for (const x of DRIVERS_X) loco.add(mesh(cylZ(0.08, 1.2, 16), M.iron, x, AXLE_Y, 0));
loco.add(mesh(cylZ(0.06, 1.2, 16), M.iron, 2.65, 0.77, 0));

// --- motion: coupling rod, main rod, crosshead, piston rod (all animated) ---
const rods = [];
for (const s of [-1, 1]) {
  const coupling = new THREE.Group();
  coupling.add(mesh(new THREE.BoxGeometry(DRIVERS_X[2] - DRIVERS_X[0], 0.1, 0.05), M.steel));
  for (const x of DRIVERS_X) coupling.add(mesh(cylZ(0.075, 0.07, 20), M.steel, x - DRIVERS_X[1], 0, 0));
  const main = new THREE.Group();
  main.add(mesh(new THREE.BoxGeometry(1, 0.1, 0.05), M.steel));
  main.add(mesh(cylZ(0.08, 0.07, 20), M.steel, -0.5, 0, 0), mesh(cylZ(0.07, 0.07, 20), M.steel, 0.5, 0, 0));
  const crosshead = mesh(new THREE.BoxGeometry(0.22, 0.2, 0.1), M.steel);
  const piston = mesh(cylX(0.04, 0.7, 12), M.steel);
  loco.add(coupling, main, crosshead, piston);
  rods.push({ coupling, main, crosshead, piston, zc: s * (WHEEL_Z + 0.15), zm: s * (WHEEL_Z + 0.24), phase: s > 0 ? 0 : Math.PI / 2 });
}

// --- tender: tank, flared coal bunker, coal heap, water hatch, bogies, lettering ---
const tender = new THREE.Group();
tender.add(mesh(new THREE.BoxGeometry(2.6, 1.6, 1.9), M.paint, 0, 1.9, 0));
tender.add(mesh(new THREE.BoxGeometry(2.64, 0.08, 1.94), M.brass, 0, 2.72, 0));
tender.add(mesh(new THREE.BoxGeometry(2.64, 0.06, 1.94), M.black, 0, 1.12, 0));
for (const s of [-1, 1]) { // flared coal boards
  const flare = mesh(new THREE.BoxGeometry(1.5, 0.3, 0.04), M.paint, 0.5, 2.88, s * 0.98);
  flare.rotation.x = s * 0.35; tender.add(flare);
}
tender.add(mesh(new THREE.BoxGeometry(0.04, 0.3, 1.9), M.paint, -0.25, 2.88, 0));
tender.add(mesh(new THREE.BoxGeometry(1.45, 0.08, 1.8), M.coal, 0.5, 2.72, 0));
{
  const lumps = [];
  for (let i = 0; i < 420; i++) {
    const x = 0.5 + (rand() - 0.5) * 1.4, z = (rand() - 0.5) * 1.75;
    const h = 0.32 * (1 - Math.min(1, Math.hypot((x - 0.5) / 0.75, z / 0.95))) ;
    lumps.push([x, 2.78 + rand() * h, z]);
  }
  instanced(new THREE.DodecahedronGeometry(0.075, 0), M.coal, lumps, tender, 0.9);
}
tender.add(mesh(cylY(0.26, 0.12), M.black, -0.8, 2.78, 0));                  // water hatch
tender.add(mesh(cylY(0.2, 0.04), M.steel, -0.8, 2.85, 0));
tender.add(mesh(new THREE.BoxGeometry(0.5, 0.25, 0.35), M.black, -0.85, 2.85, 0.6)); // tool box
tender.add(mesh(new THREE.BoxGeometry(0.2, 0.22, 0.22), M.black, -1.32, 2.4, 0));    // back-up light
tender.add(mesh(new THREE.CircleGeometry(0.07, 16).rotateY(-Math.PI / 2), M.lamp, -1.43, 2.4, 0));
tender.add(mesh(new THREE.BoxGeometry(2.9, 0.16, 1.9), M.black, 0, 1.03, 0));
for (const s of [-1, 1]) {
  const txt = mesh(new THREE.PlaneGeometry(2.0, 0.42), label('PACIFIC', 2.0, 0.42, '#e8c46a'), 0, 1.95, s * 0.962);
  txt.castShadow = false;
  if (s < 0) txt.rotation.y = Math.PI;
  tender.add(txt);
  for (const y of [2.62, 1.2]) for (let x = -1.25; x <= 1.26; x += 0.125) rivets.push([-4.3 + x, y, s * 0.955]);
  for (const x of [-1.25, 1.25]) for (let y = 1.2; y <= 2.62; y += 0.125) rivets.push([-4.3 + x, y, s * 0.955]);
  for (const x of [-1.33, 1.33]) tender.add(pipe([x, 1.25, s * 0.85], [x, 2.6, s * 0.85], 0.018, M.steel)); // grab irons
}
// two four-wheel bogies
for (const bx of [-0.8, 0.8]) {
  for (const s of [-1, 1]) {
    for (const dx of [-0.42, 0.42]) {
      const w = wheel(0.36, 8, s); w.position.set(bx + dx, 0.39 + 0.36, s * WHEEL_Z); tender.add(w); wheels.push({ w, r: 0.36 });
    }
    tender.add(mesh(new THREE.BoxGeometry(1.3, 0.16, 0.06), M.black, bx, 0.78, s * 0.86));       // side frame
    tender.add(mesh(new THREE.BoxGeometry(0.32, 0.28, 0.08), M.black, bx, 0.78, s * 0.87));      // bolster
    for (let k = 0; k < 3; k++) tender.add(mesh(cylY(0.04, 0.16), M.steel, bx - 0.1 + k * 0.1, 0.62, s * 0.87)); // coil springs
    for (const dx of [-0.42, 0.42]) tender.add(mesh(new THREE.BoxGeometry(0.16, 0.16, 0.1), M.black, bx + dx, 0.75, s * 0.88)); // journal boxes
  }
  for (const dx of [-0.42, 0.42]) tender.add(mesh(cylZ(0.05, 1.3, 12), M.iron, bx + dx, 0.75, 0));
}
tender.position.set(-4.3, 0, 0);
loco.add(tender);
loco.add(mesh(new THREE.BoxGeometry(0.5, 0.1, 0.25), M.black, -2.85, 1.0, 0)); // drawbar between engine & tender
loco.add(mesh(new THREE.BoxGeometry(0.5, 0.05, 1.6), M.black, -2.85, 1.3, 0));  // fall plate

// all rivets in one draw call
instanced(new THREE.SphereGeometry(0.018, 8, 6), M.iron, rivets, loco);

// ---------- smoke + steam (sprite pools) ----------
const smokeTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), grd = g.createRadialGradient(64, 64, 4, 64, 64, 62);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(0.5, 'rgba(235,235,235,.6)'); grd.addColorStop(1, 'rgba(220,220,220,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();
const puffs = [];
for (let i = 0; i < 70; i++) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex, transparent: true, depthWrite: false, opacity: 0 }));
  sp.visible = false; scene.add(sp); puffs.push({ sp, life: 0, vel: new V3(), grow: 1, tone: 1 });
}
const tmp = new V3();
function spawn(local, vel, grow, tone, size) {
  const p = puffs.find(p => p.life <= 0); if (!p) return;
  tmp.set(...local); loco.localToWorld(tmp);
  p.sp.position.copy(tmp); p.vel.set(...vel); p.grow = grow; p.size = size;
  p.sp.material.color.setScalar(tone);
  p.life = 1; p.sp.visible = true;
}
const smoke = () => spawn([2.55, 3.75, 0], [-0.6 - rand() * 0.4, 1.6 + rand() * 0.6, (rand() - 0.5) * 0.4], 2.4, 0.72 + rand() * 0.2, 0.5);
const cylSteam = s => spawn([2.95, 0.8, s * 1.0], [0.4 + rand() * 0.3, 0.15, s * (0.6 + rand() * 0.4)], 1.4, 1, 0.25); // cylinder cocks

// ---------- tap animation: chug forward, puff, roll back ----------
let playT = -1;              // seconds into the one-shot, -1 = idle
const PLAY_LEN = 3.2, TRAVEL = 2.2;
let nextPuff = 0, nextHiss = 0;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function locoX(t) { // forward then back to rest
  const u = t / PLAY_LEN;
  return u < 0.55 ? TRAVEL * ease(u / 0.55) : TRAVEL * (1 - ease((u - 0.55) / 0.45));
}
function start() { if (playT < 0) { playT = 0; nextPuff = 0; nextHiss = 0; } }

let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6) start();
  down = null;
});
addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') start(); });

// ---------- loop ----------
const clock = new THREE.Clock();
let lastX = 0, distance = 0, time = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;
  if (playT >= 0) {
    playT += dt;
    if (playT >= nextPuff && playT < PLAY_LEN * 0.6) { smoke(); nextPuff += 0.22; }
    if (playT >= nextHiss && playT < 0.8) { cylSteam(1); cylSteam(-1); nextHiss += 0.08; }
    if (playT >= PLAY_LEN) playT = -1;
  }
  const x = playT >= 0 ? locoX(playT) : 0;
  distance += x - lastX; lastX = x;
  loco.position.x = x;
  loco.position.y = playT >= 0 ? Math.abs(Math.sin(playT * 18)) * 0.012 : 0; // tiny chuff bounce
  bellPivot.rotation.x = playT >= 0 ? Math.sin(playT * 7) * 0.5 * Math.max(0, 1 - playT / PLAY_LEN) : 0;
  M.lamp.emissiveIntensity = 0.6 + Math.sin(time * 9) * 0.04;

  for (const { w, r } of wheels) w.rotation.z = -distance / r;
  const ang = -distance / R;
  for (const rd of rods) {
    const a = ang + rd.phase;
    const cx = Math.cos(a) * CRANK, cy = Math.sin(a) * CRANK;
    rd.coupling.position.set(DRIVERS_X[1] + cx, AXLE_Y + cy, rd.zc);
    // main rod: crosshead (slides on the bars) -> middle driver crank pin
    const crossX = 1.62 + cx;
    const px = DRIVERS_X[1] + cx, py = AXLE_Y + cy;
    const dx = crossX - px, dy = 1.0 - py, len = Math.hypot(dx, dy);
    rd.main.position.set((crossX + px) / 2, (1.0 + py) / 2, rd.zm);
    rd.main.rotation.z = Math.atan2(dy, dx);
    rd.main.scale.x = len;
    rd.main.children[1].scale.x = rd.main.children[2].scale.x = 1 / len; // keep bosses round
    rd.crosshead.position.set(crossX, 1.0, rd.zm > 0 ? 0.96 : -0.96);
    rd.piston.position.set(crossX + 0.4, 1.0, rd.zm > 0 ? 0.96 : -0.96);
  }

  for (const p of puffs) {
    if (p.life <= 0) continue;
    p.life -= dt / 1.8;
    p.sp.position.addScaledVector(p.vel, dt);
    const s = p.size + (1 - p.life) * p.grow;
    p.sp.scale.set(s, s, s);
    p.sp.material.opacity = Math.min(1, p.life * 1.4) * 0.85;
    if (p.life <= 0) p.sp.visible = false;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
