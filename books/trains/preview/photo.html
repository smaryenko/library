<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trains preview A — photo cut-out</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1a17; color: #f4efe6; font: 16px/1.4 system-ui, sans-serif; }
  .wrap { height: 100%; display: grid; place-items: center; perspective: 1000px; overflow: hidden; }
  /* the tilting stack; JS sets --rx / --ry */
  .stage { position: relative; width: min(94vw, 1100px, calc(88vh * 1920 / 1356)); aspect-ratio: 1920 / 1356;
    transform-style: preserve-3d; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    transition: transform .3s ease-out; cursor: pointer; }
  .stage * { transform-style: preserve-3d; }
  .layer, .cut { position: absolute; inset: 0; }
  .cut { background: url(img/loco.jpg) 0 0 / 100% 100%; }
  /* cut-outs are rendered into canvases (feathered edge + sky keyed to transparent) */
  [data-clip] { position: absolute; inset: 0; }
  [data-clip] canvas { position: absolute; display: block; }
  /* ground bands: depth grows towards the viewer so the rails stay under the wheels */
  .g-far   { transform: translateZ(-50px); }
  .g-track { transform: translateZ(26px); }
  .g-near  { transform: translateZ(70px); }
  /* backdrop pushed far back; blurred + dimmed so the engine's ghost behind the cut-out reads as depth-of-field */
  .back { transform: translateZ(-140px) scale(1.14); border-radius: 14px; overflow: hidden; }
  .back .cut { filter: blur(6px) brightness(.8) saturate(1.05); border-radius: 14px; }
  /* a soft contact shadow under the engine, on the ground plane */
  .shadow { transform: translateZ(28px); }
  .shadow::after { content: ''; position: absolute; left: 22%; right: 8%; top: 76%; height: 9%;
    background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.55), transparent 70%);
    transform: rotate(-4deg); filter: blur(6px); }
  /* the engine: drop-shadow lives on the wrapper because clip-path would clip it */
  .body  { transform: translateZ(30px); filter: drop-shadow(-10px 14px 14px rgba(0,0,0,.45)); }
  .cab   { transform: translateZ(10px); }
  .front { transform: translateZ(75px); filter: drop-shadow(-6px 8px 8px rgba(0,0,0,.35)); }
  .stack { transform: translateZ(95px); }
  .lamp  { transform: translateZ(110px); }

  .train { position: absolute; inset: 0; }
  .train.chug { animation: chug 1.8s ease-in-out; }
  /* rolls along the track (towards lower-left in this photo), then back */
  @keyframes chug {
    0%,100% { transform: translate(0,0); }
    10% { transform: translate(3px,-2px); }
    25% { transform: translate(-10px,1px); }
    35% { transform: translate(-14px,0); }
    50% { transform: translate(-26px,3px); }
    62% { transform: translate(-30px,2px); }
    80% { transform: translate(-12px,1px); }
  }
  .stack.chug { animation: stackbob .3s ease-in-out 5; }
  @keyframes stackbob { 50% { transform: translateZ(95px) translateY(-2px) scaleY(1.01); } }
  /* headlamp glow */
  .glow { position: absolute; left: 33.3%; top: 43.9%; width: 9%; aspect-ratio: 1; margin: -4.5% 0 0 -4.5%;
    border-radius: 50%; opacity: 0; transform: translateZ(115px); pointer-events: none;
    background: radial-gradient(circle, rgba(255,247,210,1) 0%, rgba(255,220,140,.55) 30%, rgba(255,200,100,0) 70%); }
  .glow.go { animation: glow 1.8s ease-out; }
  @keyframes glow { 10%,55% { opacity: 1; } 100% { opacity: 0; } }
  /* fx: smoke puffs at the chimney top (41% / 30.8% of the photo) and steam at the trucks */
  .fx { position: absolute; inset: 0; transform: translateZ(120px); pointer-events: none; }
  .puff { position: absolute; width: 7%; aspect-ratio: 1; margin: -3.5% 0 0 -3.5%; border-radius: 50%; opacity: 0;
    background: radial-gradient(circle at 40% 38%, rgba(70,70,72,.95), rgba(110,110,112,.7) 45%, rgba(150,150,152,0) 72%); }
  .puff.steam { width: 4%; margin: -2% 0 0 -2%;
    background: radial-gradient(circle at 40% 38%, rgba(255,255,255,.95), rgba(235,235,235,.6) 45%, rgba(220,220,220,0) 72%); }
  .puff.go { animation: puff var(--dur, 1.9s) ease-out forwards; }
  @keyframes puff {
    0% { opacity: 0; transform: translate(0,0) scale(.3); }
    15% { opacity: .95; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(var(--sc, 2.8)); }
  }
  .hint { position: fixed; left: 0; right: 0; bottom: 10px; text-align: center; opacity: .7; }
  .hint a { color: inherit; }
  @media (prefers-reduced-motion: reduce) { .stage { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage" role="button" tabindex="0"
       aria-label="Photo of the steam engine Alberni Pacific number 2. Tap to make it chug, flash its lamp and puff smoke.">
    <div class="layer back"><div class="cut"></div></div>
    <div class="layer g-far"><div data-clip="groundFar"></div></div>
    <div class="layer g-track"><div data-clip="track"></div></div>
    <div class="layer shadow"></div>
    <div class="train" id="train">
      <div class="layer cab"><div data-clip="cab"></div></div>
      <div class="layer body"><div data-clip="body"></div></div>
      <div class="layer front"><div data-clip="front"></div></div>
      <div class="layer stack" id="stack"><div data-clip="stack"></div></div>
      <div class="layer lamp"><div data-clip="lamp"></div></div>
      <div class="glow" id="glow"></div>
    </div>
    <div class="layer g-near"><div data-clip="groundNear"></div></div>
    <div class="fx" id="fx"></div>
  </div>
</div>
<p class="hint">Tap the train · move the mouse or tilt your phone · <a href="index.html">back</a></p>
<script>
(function () {
  'use strict';
  // Cut-out outlines, traced in photo pixels (1920 x 1356); converted to % clip-paths below.
  const W = 1920, H = 1356;
  const CLIPS = {
    // whole engine silhouette, minus the cab (drawn separately, further back)
    body: [[405,1105],[455,1090],[455,885],[610,870],[625,760],[608,640],[608,590],[625,555],[690,548],[722,575],
      [748,592],[745,418],[832,415],[835,600],[845,600],[842,420],[856,420],[858,600],[880,565],[888,515],[940,497],
      [1000,515],[1012,560],[1018,650],[1036,645],[1040,555],[1100,540],[1168,556],[1175,700],[1535,700],
      [1535,660],[1600,655],[1700,688],[1712,720],[1715,860],[1745,870],[1750,960],[1690,1000],[1650,1030],
      [1550,1050],[1150,1100],[1080,1145],[800,1150],[780,1178],[560,1172],[530,1150],[408,1132]],
    // cab: roof to footplate
    cab: [[1165,560],[1175,540],[1300,523],[1430,528],[1545,565],[1548,592],[1535,600],[1535,870],[1168,870]],
    // smokebox face, pilot beam and step: closest big part
    front: [[408,1105],[455,1090],[455,885],[612,870],[628,770],[660,700],[730,680],[775,720],[790,800],
      [800,880],[800,1150],[780,1178],[560,1172],[530,1150],[408,1132]],
    stack: [[745,418],[832,415],[834,645],[748,645]],
    lamp: [[606,588],[612,566],[632,552],[690,548],[718,568],[724,610],[712,636],[668,648],[622,640]],
    // ground, split into bands that follow the rails' slope (they rise to the right in this photo).
    // Bands overlap and are heavily feathered so there's no visible seam between depths.
    groundFar:  [[0,1110],[1920,860],[1920,975],[0,1225]],      // gravel behind the engine's track
    track:      [[0,1170],[1920,925],[1920,1030],[0,1315]],     // the rails the engine stands on
    groundNear: [[0,1280],[1920,995],[1920,1356],[0,1356]]      // gravel + second track in front
  };
  // per-layer cut settings: feather = edge softness (photo px); key = make pale sky inside the outline transparent
  const CUT = {
    body: { feather: 1.5, key: true }, cab: { feather: 1.5, key: true }, front: { feather: 1.5, key: true },
    stack: { feather: 1.5, key: true }, lamp: { feather: 1.5, key: false },
    groundFar: { feather: 30 }, track: { feather: 22 }, groundNear: { feather: 30 }
  };
  const SKY_LINE = 715;                       // keying only above the boiler line (keeps white lettering below)
  const LAMP_BOX = [600, 540, 730, 655];      // never key the bright headlamp lens
  const smooth = (a, b, v) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); };

  function cutLayer(img, el, pts, { feather, key }) {
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), pad = Math.ceil(feather * 2);
    const x0 = Math.max(0, Math.min(...xs) - pad), y0 = Math.max(0, Math.min(...ys) - pad);
    const x1 = Math.min(W, Math.max(...xs) + pad), y1 = Math.min(H, Math.max(...ys) + pad);
    const c = document.createElement('canvas'); c.width = x1 - x0; c.height = y1 - y0;
    const g = c.getContext('2d', { willReadFrequently: key });
    g.translate(-x0, -y0);
    const path = new Path2D(); pts.forEach(([x, y], i) => i ? path.lineTo(x, y) : path.moveTo(x, y)); path.closePath();
    if ('filter' in g) g.filter = `blur(${feather}px)`;  // feathered mask (plain edge where unsupported)
    g.fillStyle = '#000'; g.fill(path);
    g.filter = 'none';
    g.globalCompositeOperation = 'source-in';
    g.drawImage(img, 0, 0, W, H);
    if (key && y0 < SKY_LINE && canReadPixels(g)) {
      // pale, unsaturated pixels = sky / steam showing through gaps in the outline -> fade them out
      const h = Math.min(SKY_LINE, y1) - y0, d = g.getImageData(0, 0, c.width, h), px = d.data;
      for (let y = 0; y < h; y++) for (let x = 0; x < c.width; x++) {
        const gx = x + x0, gy = y + y0;
        if (gx > LAMP_BOX[0] && gx < LAMP_BOX[2] && gy > LAMP_BOX[1] && gy < LAMP_BOX[3]) continue;
        const i = (y * c.width + x) * 4, r = px[i], gg = px[i + 1], b = px[i + 2];
        const l = (r + gg + b) / 3, sat = Math.max(r, gg, b) - Math.min(r, gg, b);
        const k = smooth(120, 175, l) * (1 - smooth(45, 80, sat));
        if (k > 0) px[i + 3] = px[i + 3] * (1 - k);
      }
      g.putImageData(d, 0, 0);
    }
    Object.assign(c.style, { left: x0 / W * 100 + '%', top: y0 / H * 100 + '%', width: c.width / W * 100 + '%', height: c.height / H * 100 + '%' });
    el.appendChild(c);
  }
  // Pixel reads throw on file:// (canvas "tainted"); then skip the sky keying instead of aborting the layer.
  let pixelsOK = null;
  function canReadPixels(g) {
    if (pixelsOK === null) {
      try { g.getImageData(0, 0, 1, 1); pixelsOK = true; }
      catch (e) { pixelsOK = false; console.warn('Sky keying skipped: serve over http (python3 -m http.server) to enable it.'); }
    }
    return pixelsOK;
  }
  const photo = new Image();
  photo.onload = () => document.querySelectorAll('[data-clip]').forEach(el => {
    try { cutLayer(photo, el, CLIPS[el.dataset.clip], CUT[el.dataset.clip]); }
    catch (e) { console.error('cut failed:', el.dataset.clip, e); }
  });
  photo.src = 'img/loco.jpg';

  const stage = document.getElementById('stage');
  const train = document.getElementById('train');
  const stack = document.getElementById('stack');
  const glow = document.getElementById('glow');
  const fx = document.getElementById('fx');

  // tilt: mouse on desktop, device orientation on phones; ?tilt=x,y forces a pose
  function tilt(x, y) { // x,y in -1..1
    stage.style.setProperty('--ry', (x * 20).toFixed(2) + 'deg');
    stage.style.setProperty('--rx', (-y * 12).toFixed(2) + 'deg');
  }
  const forced = new URLSearchParams(location.search).get('tilt');
  if (forced) { const [x, y] = forced.split(',').map(Number); tilt(x || 0, y || 0); }
  else {
    addEventListener('pointermove', e => {
      if (e.pointerType === 'mouse') tilt(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1);
    });
    addEventListener('deviceorientation', e => {
      if (e.gamma == null) return;
      tilt(Math.max(-1, Math.min(1, e.gamma / 30)), Math.max(-1, Math.min(1, (e.beta - 40) / 30)));
    });
  }

  function puff(x, y, cls, dx, dy, sc, dur) { // x,y in % of the photo
    const p = document.createElement('div');
    p.className = 'puff' + (cls ? ' ' + cls : '');
    p.style.left = x + '%'; p.style.top = y + '%';
    p.style.setProperty('--dx', dx + 'px'); p.style.setProperty('--dy', dy + 'px');
    p.style.setProperty('--sc', sc); p.style.setProperty('--dur', dur + 's');
    fx.appendChild(p);
    requestAnimationFrame(() => p.classList.add('go'));
    setTimeout(() => p.remove(), dur * 1000 + 100);
  }
  const restart = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

  // tap: lamp flashes, engine chugs along the track, chimney puffs, steam hisses at the trucks
  function play() {
    restart(train, 'chug'); restart(stack, 'chug'); restart(glow, 'go');
    for (let i = 0; i < 5; i++) {
      setTimeout(() => puff(41.0, 30.6, '', 40 + Math.random() * 50, -170 - Math.random() * 60, 2.6 + Math.random(), 1.9), i * 300);
    }
    for (let i = 0; i < 6; i++) {
      setTimeout(() => {
        puff(52 + Math.random() * 8, 79, 'steam', -40 - Math.random() * 40, -20 - Math.random() * 20, 2.2, 1.1);
      }, i * 90);
    }
  }
  stage.addEventListener('click', play);
  stage.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); } });
})();
</script>
</body>
</html>
