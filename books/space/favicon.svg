<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- deep-space disc -->
    <radialGradient id="sky" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1d2a5e"/>
      <stop offset="100%" stop-color="#060914"/>
    </radialGradient>
    <!-- Saturn's globe: lit upper-left, warm butterscotch to dusky limb -->
    <radialGradient id="globe" cx="36%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#fff3d2"/>
      <stop offset="45%" stop-color="#e8c98c"/>
      <stop offset="80%" stop-color="#a9814a"/>
      <stop offset="100%" stop-color="#5c4220"/>
    </radialGradient>
    <!-- soft cloud bands across the globe -->
    <linearGradient id="bands" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#000" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#8a6534" stop-opacity="0.35"/>
      <stop offset="38%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="55%"  stop-color="#7a5528" stop-opacity="0.4"/>
      <stop offset="64%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="78%"  stop-color="#6b4a22" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <!-- rings: dim C ring, bright B ring, Cassini gap, A ring -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#b89a68"/>
      <stop offset="50%"  stop-color="#f4e2b4"/>
      <stop offset="100%" stop-color="#b89a68"/>
    </linearGradient>
    <clipPath id="ball"><circle cx="0" cy="0" r="13"/></clipPath>
    <!-- the globe hides the rings' far half; the near half crosses in front -->
    <clipPath id="front"><rect x="-40" y="0" width="80" height="20"/></clipPath>
  </defs>

  <circle cx="32" cy="32" r="31" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="13" cy="17" r="0.9" opacity="0.9"/>
    <circle cx="50" cy="12" r="0.7" opacity="0.7"/>
    <circle cx="54" cy="47" r="0.9" opacity="0.8"/>
    <circle cx="16" cy="50" r="0.6" opacity="0.6"/>
  </g>

  <g transform="translate(32 32) rotate(-22)">
    <!-- far half of the rings (behind the globe) -->
    <g fill="none">
      <ellipse rx="25" ry="7.2" stroke="#a88a5a" stroke-width="2.2" opacity="0.85"/>
      <ellipse rx="20.5" ry="5.9" stroke="url(#ring)" stroke-width="4.2"/>
      <ellipse rx="16.6" ry="4.8" stroke="#8c7350" stroke-width="1.6" opacity="0.6"/>
    </g>
    <!-- globe -->
    <circle r="13" fill="url(#globe)"/>
    <rect x="-13" y="-13" width="26" height="26" fill="url(#bands)" clip-path="url(#ball)"/>
    <!-- ring shadow on the globe -->
    <ellipse cy="1.6" rx="13" ry="2" fill="#3a2a14" opacity="0.35" clip-path="url(#ball)"/>
    <!-- near half of the rings (in front of the globe) -->
    <g fill="none" clip-path="url(#front)">
      <ellipse rx="25" ry="7.2" stroke="#a88a5a" stroke-width="2.2" opacity="0.85"/>
      <ellipse rx="20.5" ry="5.9" stroke="url(#ring)" stroke-width="4.2"/>
      <ellipse rx="16.6" ry="4.8" stroke="#8c7350" stroke-width="1.6" opacity="0.6"/>
    </g>
  </g>
</svg>
