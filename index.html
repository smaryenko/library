<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Story Library</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <meta name="theme-color" content="#0e1222">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Story Library">
  <meta property="og:description" content="Pick a book and watch it pop to life!">
  <meta property="og:url" content="https://smaryenko.github.io/library/">
  <meta property="og:image" content="https://smaryenko.github.io/library/assets/og.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://smaryenko.github.io/library/assets/og.png">
  <!-- Fredoka + Nunito: the stylesheet is added by shelf.js so it never
       blocks the first paint (it can take seconds); system fonts show first -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/shelf.css?v=18">
</head>
<body>
  <div class="shelf-bg" aria-hidden="true">
    <div class="shelf-glow"></div>
    <div class="shelf-stars"></div>
  </div>

  <header class="shelf-header">
    <span class="shelf-badge">✦ Pop-up Tales ✦</span>
    <h1>Story Library</h1>
    <p>Pick a book and watch it pop to life!</p>
  </header>

  <main id="shelf"></main>

  <!-- manifest first, then the shelf builder -->
  <script src="assets/js/stories.js?v=23"></script>
  <script src="assets/js/shelf.js?v=23"></script>
</body>
</html>
