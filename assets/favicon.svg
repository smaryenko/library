<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Stories shelf favicon: original vector, a little bookshelf of spines on
       a night-sky disc. Book-neutral (the shelf, not any one story). -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="70%">
      <stop offset="0%"  stop-color="#1c3a66"/>
      <stop offset="100%" stop-color="#0a1b3a"/>
    </radialGradient>
  </defs>

  <!-- night-sky disc -->
  <circle cx="32" cy="32" r="31" fill="url(#sky)"/>

  <!-- faint stars -->
  <g fill="#dce9ff">
    <circle cx="14" cy="15" r="1.3"/><circle cx="51" cy="14" r="1"/>
    <circle cx="13" cy="50" r="1"/><circle cx="52" cy="50" r="1.2"/>
  </g>

  <!-- bookshelf: two shelves, a row of coloured spines on each -->
  <g>
    <!-- upper row of books -->
    <g>
      <rect x="15" y="16" width="6"  height="20" rx="1.2" fill="#e2574e"/>
      <rect x="22" y="14" width="5"  height="22" rx="1.2" fill="#f2c94c"/>
      <rect x="28" y="17" width="6"  height="19" rx="1.2" fill="#5fbf6a"/>
      <!-- one book leaning -->
      <rect x="35" y="16" width="5"  height="20" rx="1.2" fill="#6fb7d6"
            transform="rotate(10 37.5 36)"/>
      <rect x="42" y="15" width="6"  height="21" rx="1.2" fill="#d98cc4"/>
    </g>
    <!-- upper shelf plank -->
    <rect x="12" y="36" width="40" height="3.2" rx="1" fill="#6b4a2c"/>

    <!-- lower row of books -->
    <g>
      <rect x="15" y="40" width="5"  height="16" rx="1.2" fill="#f2c94c"/>
      <rect x="21" y="39" width="6"  height="17" rx="1.2" fill="#6fb7d6"/>
      <rect x="28" y="41" width="5"  height="15" rx="1.2" fill="#e2574e"/>
      <rect x="34" y="39" width="6"  height="17" rx="1.2" fill="#5fbf6a"/>
      <rect x="41" y="40" width="7"  height="16" rx="1.2" fill="#d98cc4"/>
    </g>
    <!-- lower shelf plank -->
    <rect x="12" y="56" width="40" height="3.2" rx="1" fill="#6b4a2c"/>
  </g>
</svg>
